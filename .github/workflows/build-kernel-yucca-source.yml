name: "[EXP3] SM8550 — yucca-a mirror + fuzz analysis"

# ══════════════════════════════════════════════════════════════════
#  Mirrors yucca-a's ACTUAL patch pipeline, derived from their own
#  build log, and measures fuzz precisely.
#
#  yucca-a's real sequence (verbatim from their log):
#    SuSFS: clone gki-android13-5.15 @ 415e4143...
#           from https://github.com/ShirkNeko/susfs4ksu.git
#    SuSFS: applying main patch (tolerant: --forward --fuzz=3)
#    SuSFS: main patch placed with no rejects.
#    ZeroMount: clone Super-Builders @ c2cb7161...
#    ZeroMount: patch applied.
#    ZeroMount: task_mmu metadata hook fixed.
#
#  KEY: they use ShirkNeko PINNED, not simonpunk floating.
#  They also use --fuzz=3 deliberately. Fuzz is expected; the
#  question is HOW MUCH.
#
#  susfs_source selector:
#    yucca-shirkneko   ShirkNeko @ pinned commit  (yucca-a mirror)
#    shirkneko-head    ShirkNeko @ branch HEAD
#    simonpunk         simonpunk (what EXP2 used)
#    super-builders    Super-Builders' own 50_ (+51_/70_ if enabled)
#
#  Isolation: workflow_dispatch only, exp3-* caches, EXP3-* artifacts.
# ══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo"
        type: string
        default: "yucca-a/kernel_samsung_sm8550"
      susfs_source:
        description: "SUSFS patch source"
        type: choice
        options:
          - yucca-shirkneko
          - shirkneko-head
          - simonpunk
          - super-builders
        default: yucca-shirkneko
      apply_extra_sb:
        description: "Also apply Super-Builders 51_ / 70_ (super-builders mode only)"
        type: boolean
        default: false
      enable_zeromount:
        description: "Apply ZeroMount 60_"
        type: boolean
        default: true
      max_fuzz:
        description: "Fail if any hunk exceeds this fuzz (0-3, or 99 = never fail)"
        type: string
        default: "99"
      patch_only:
        description: "Patch + report fuzz, then STOP (no compile)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

env:
  OWN_REPO: ndutg/sm8550-S23-Ultra-common-KSU-Next-ReSukiSu-Ultra-with-SUSFS
  OWN_REF: android13-5.15
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  # Pins taken verbatim from yucca-a's build log
  SHIRKNEKO_REPO: https://github.com/ShirkNeko/susfs4ksu.git
  SHIRKNEKO_PIN: 415e4143ee1dd557c54d2b3d94ef098e5d1236f4
  SIMONPUNK_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  ZEROMOUNT_REPO: https://github.com/Enginex0/Super-Builders.git
  ZEROMOUNT_COMMIT: c2cb71614868fe742cbffee2b6f3126523432673
  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  build:
    name: "EXP3 ${{ inputs.susfs_source }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/share/boost /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.kernel_repo }}
          ref: main
          fetch-depth: 1

      - name: Checkout own repo (AnyKernel3)
        if: ${{ !inputs.patch_only }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWN_REPO }}
          ref: ${{ env.OWN_REF }}
          fetch-depth: 1
          path: .own-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip unzip \
            python3 python-is-python3 tar perl lz4 jq ccache rsync

      - name: Setup ReSukiSU
        run: |
          curl -sSfL --retry 3 --connect-timeout 20 "${{ env.RESUKISU_SETUP }}" \
            | bash -s main || { echo "ERROR: setup.sh failed"; exit 1; }

          if [ -L drivers/kernelsu ]; then
            echo "  drivers/kernelsu -> $(readlink drivers/kernelsu)"
            [ -d drivers/kernelsu ] && echo "  ✅ resolves" \
              || { echo "  ❌ DANGLING"; exit 1; }
          elif [ -d drivers/kernelsu ]; then
            echo "  ✅ drivers/kernelsu is a directory"
          else
            echo "  ❌ missing after setup.sh"; exit 1
          fi

          KSU_TAG=$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo main)
          echo "  ReSukiSU: ${KSU_TAG}"
          echo "KSU_TAG=${KSU_TAG}" >> $GITHUB_ENV
          echo "BUILDSUFFIX=resukisu-${KSU_TAG}-manual-hook" >> $GITHUB_ENV

      # ══════════════════════════════════════════════════════════
      # Fetch SUSFS from the selected source
      # ══════════════════════════════════════════════════════════
      - name: Fetch SUSFS source (${{ inputs.susfs_source }})
        run: |
          SRC="${{ inputs.susfs_source }}"
          echo "=================================================="
          echo "  SUSFS SOURCE: ${SRC}"
          echo "=================================================="

          case "$SRC" in
            yucca-shirkneko)
              echo "Mirroring yucca-a: ShirkNeko @ pinned ${{ env.SHIRKNEKO_PIN }}"
              git clone "${{ env.SHIRKNEKO_REPO }}" -b "${{ env.SUSFS_BRANCH }}" susfs4ksu \
                || { echo "ERROR: clone failed"; exit 1; }
              git -C susfs4ksu checkout "${{ env.SHIRKNEKO_PIN }}" \
                || { echo "ERROR: pinned commit not found"; exit 1; }
              ;;
            shirkneko-head)
              echo "ShirkNeko @ ${{ env.SUSFS_BRANCH }} HEAD"
              git clone --depth 1 "${{ env.SHIRKNEKO_REPO }}" \
                -b "${{ env.SUSFS_BRANCH }}" susfs4ksu \
                || { echo "ERROR: clone failed"; exit 1; }
              ;;
            simonpunk)
              echo "simonpunk @ ${{ env.SUSFS_BRANCH }} HEAD"
              git clone --depth 1 "${{ env.SIMONPUNK_REPO }}" \
                -b "${{ env.SUSFS_BRANCH }}" susfs4ksu \
                || { echo "ERROR: clone failed"; exit 1; }
              ;;
            super-builders)
              echo "Super-Builders bundled SUSFS"
              git clone "${{ env.ZEROMOUNT_REPO }}" sb-src \
                || { echo "ERROR: clone failed"; exit 1; }
              git -C sb-src checkout "${{ env.ZEROMOUNT_COMMIT }}" || exit 1
              echo "SB_MODE=1" >> $GITHUB_ENV
              ;;
          esac

          if [ -d susfs4ksu ]; then
            echo ""
            echo "SUSFS HEAD    : $(git -C susfs4ksu rev-parse --short HEAD)"
            echo "SUSFS subject : $(git -C susfs4ksu log -1 --format=%s)"
            echo "SUSFS date    : $(git -C susfs4ksu log -1 --format=%ci)"
            echo "SUSFS_SHA=$(git -C susfs4ksu rev-parse --short HEAD)" >> $GITHUB_ENV
            echo ""
            echo "Available patches:"
            ls -1 susfs4ksu/kernel_patches/*.patch 2>/dev/null | sed 's/^/  /' || true
          fi

      # ══════════════════════════════════════════════════════════
      # Apply patches with PER-HUNK FUZZ MEASUREMENT
      # ══════════════════════════════════════════════════════════
      - name: Apply patches and measure fuzz
        id: patches
        run: |
          mkdir -p /tmp/fuzzlogs
          SB_DIR="sb-src/${{ env.SUSFS_BRANCH }}"
          SB_DIR="${SB_DIR/gki-/}"
          SB_DIR="sb-src/$(echo '${{ env.SUSFS_BRANCH }}' | sed 's/^gki-//')/ReSukiSU/patches"

          # apply_and_measure <label> <patchfile>
          apply_and_measure() {
            local LABEL="$1"
            local PF="$2"
            local LOG="/tmp/fuzzlogs/${LABEL}.log"

            echo ""
            echo "──────────────────────────────────────────────"
            echo "  APPLYING: ${LABEL}"
            echo "  File    : ${PF}"
            echo "──────────────────────────────────────────────"

            if [ ! -f "$PF" ]; then
              echo "  ⚠️  patch file not found — skipping"
              return 1
            fi

            touch /tmp/ts_${LABEL}

            # Try clean first — this is the measurement that matters.
            if patch -p1 --forward --dry-run < "$PF" >/dev/null 2>&1; then
              echo "  ✅ CLEAN APPLY (fuzz=0)"
              patch -p1 --forward < "$PF" | tee "$LOG"
              echo "${LABEL}:0:clean" >> /tmp/fuzz_summary
            else
              echo "  ⚠️  needs fuzz — retrying with --fuzz=3"
              if patch -p1 --forward --fuzz=3 < "$PF" | tee "$LOG"; then
                MAXF=0
                for lvl in 1 2 3; do
                  grep -q "with fuzz ${lvl}" "$LOG" 2>/dev/null && MAXF=$lvl
                done
                echo "  ⚠️  applied with MAX FUZZ = ${MAXF}"
                echo "${LABEL}:${MAXF}:fuzzed" >> /tmp/fuzz_summary
              else
                echo "  ❌ FAILED even at fuzz=3"
                echo "${LABEL}:X:failed" >> /tmp/fuzz_summary
                find . -name '*.rej' -newer /tmp/ts_${LABEL} 2>/dev/null | while read -r r; do
                  echo "--- REJECT: $r ---"; head -50 "$r"
                done
                return 1
              fi
            fi

            REJ="$(find . -name '*.rej' -newer /tmp/ts_${LABEL} 2>/dev/null || true)"
            if [ -n "$REJ" ]; then
              echo "  ❌ REJECTS PRESENT:"
              echo "$REJ" | while read -r r; do
                [ -n "$r" ] || continue
                echo "--- REJECT: $r ---"; head -50 "$r"
              done
              return 1
            fi
            return 0
          }

          # ── SUSFS ──
          if [ "${SB_MODE:-0}" = "1" ]; then
            SBP="${SB_DIR}/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch"
            apply_and_measure "50_susfs_SB" "$SBP" || exit 1

            if [ "${{ inputs.apply_extra_sb }}" = "true" ]; then
              P51="$(find "$SB_DIR" -maxdepth 1 -name '51_*.patch' 2>/dev/null | head -1 || true)"
              [ -n "$P51" ] && apply_and_measure "51_enhanced_SB" "$P51" || echo "  (no 51_ found)"
            fi
          else
            cp susfs4ksu/kernel_patches/fs/susfs.c                fs/ 2>/dev/null || true
            cp susfs4ksu/kernel_patches/include/linux/susfs.h     include/linux/ 2>/dev/null || true
            cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true
            echo "==> SUSFS source drops copied."

            MAINP="susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch"
            apply_and_measure "50_susfs" "$MAINP" || exit 1

            KP="susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
            if [ -f "$KP" ]; then
              if patch -p1 --forward --dry-run < "$KP" >/dev/null 2>&1; then
                patch -p1 --forward < "$KP" >/dev/null 2>&1 || true
                echo "==> 10_enable_susfs_for_ksu applied."
              else
                echo "==> 10_ skipped (already applied or N/A)."
              fi
            fi
          fi

          # ── SUSFS Kconfig injection ──
          KCFG="drivers/kernelsu/Kconfig"
          if [ -f "$KCFG" ] && ! grep -q 'KSU_SUSFS' "$KCFG"; then
            printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n' >> "$KCFG"
            OPTS=$(grep -hroE 'CONFIG_KSU_SUSFS_[A-Z_]+' \
              include/linux/susfs.h fs/susfs.c 2>/dev/null \
              | sort -u | sed 's/CONFIG_KSU_SUSFS_//')
            for o in $OPTS; do
              D=$(echo "$o" | tr '_' ' ' | tr '[:upper:]' '[:lower:]')
              printf '\nconfig KSU_SUSFS_%s\n\tbool "Enable %s"\n\tdepends on KSU_SUSFS\n\tdefault y\n' "$o" "$D" >> "$KCFG"
            done
            echo "==> Injected SUSFS Kconfig: $OPTS"
          else
            echo "==> SUSFS Kconfig already present."
          fi

          # ── ZeroMount 60_ ──
          if [ "${{ inputs.enable_zeromount }}" = "true" ]; then
            if [ ! -d sb-src ]; then
              git clone "${{ env.ZEROMOUNT_REPO }}" sb-src || { echo "::warning::ZM clone failed"; }
              git -C sb-src checkout "${{ env.ZEROMOUNT_COMMIT }}" || true
            fi
            ZMP="${SB_DIR}/60_zeromount-$(echo '${{ env.SUSFS_BRANCH }}' | sed 's/^gki-//').patch"
            if apply_and_measure "60_zeromount" "$ZMP"; then
              echo "ZEROMOUNT_OK=1" >> $GITHUB_ENV
            else
              echo "::warning::ZeroMount not applied"
            fi
          fi

          # ── Super-Builders 70_ ksu_safety ──
          if [ "${SB_MODE:-0}" = "1" ] && [ "${{ inputs.apply_extra_sb }}" = "true" ]; then
            P70="$(find "$SB_DIR" -maxdepth 1 -name '70_*.patch' 2>/dev/null | head -1 || true)"
            [ -n "$P70" ] && apply_and_measure "70_ksu_safety" "$P70" || echo "  (no 70_ found)"
          fi

          rm -rf susfs4ksu sb-src

      # ══════════════════════════════════════════════════════════
      # FUZZ REPORT — the whole point of this run
      # ══════════════════════════════════════════════════════════
      - name: Fuzz report
        if: always()
        run: |
          echo "=================================================="
          echo "  FUZZ REPORT — ${{ inputs.susfs_source }}"
          echo "=================================================="
          echo ""
          printf "  %-22s %-8s %s\n" "PATCH" "MAXFUZZ" "RESULT"
          printf "  %-22s %-8s %s\n" "----------------------" "--------" "--------"

          WORST=0
          FAILED=0
          if [ -f /tmp/fuzz_summary ]; then
            while IFS=: read -r label fuzz result; do
              [ -n "$label" ] || continue
              case "$result" in
                clean)  ICON="✅" ;;
                fuzzed) ICON="⚠️ " ;;
                *)      ICON="❌"; FAILED=1 ;;
              esac
              printf "  %-22s %-8s %s %s\n" "$label" "$fuzz" "$ICON" "$result"
              case "$fuzz" in
                [0-3]) [ "$fuzz" -gt "$WORST" ] && WORST=$fuzz ;;
                *)     FAILED=1 ;;
              esac
            done < /tmp/fuzz_summary
          else
            echo "  (no patches recorded)"
          fi

          echo ""
          echo "  WORST FUZZ ACROSS ALL PATCHES: ${WORST}"
          echo ""
          case "$WORST" in
            0) echo "  ✅ PERFECT — every hunk matched exactly." ;;
            1) echo "  ✅ GOOD — fuzz 1 is minor context drift." ;;
            2) echo "  ⚠️  ACCEPTABLE — verify carefully before flashing." ;;
            3) echo "  ⚠️  HIGH — patch ignored 3 lines of context." ;;
          esac
          echo ""
          echo "  Reference: yucca-a also uses --fuzz=3 tolerant apply"
          echo "  and reports 'no rejects'. Fuzz is expected; the"
          echo "  question is how much."
          echo "=================================================="

          {
            echo "## EXP3 Fuzz Report"
            echo ""
            echo "**Source:** \`${{ inputs.susfs_source }}\`  "
            echo "**SUSFS commit:** \`${SUSFS_SHA:-n/a}\`  "
            echo "**Worst fuzz:** \`${WORST}\`"
            echo ""
            echo "| Patch | Max fuzz | Result |"
            echo "|---|---|---|"
            if [ -f /tmp/fuzz_summary ]; then
              while IFS=: read -r l f r; do
                [ -n "$l" ] || continue
                echo "| \`$l\` | $f | $r |"
              done < /tmp/fuzz_summary
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "WORST_FUZZ=${WORST}" >> $GITHUB_ENV

          MAXF="${{ inputs.max_fuzz }}"
          if [ "$MAXF" != "99" ] && [ "$WORST" -gt "$MAXF" ]; then
            echo "::error::Worst fuzz ${WORST} exceeds max_fuzz ${MAXF}"
            exit 1
          fi
          [ "$FAILED" -eq 1 ] && { echo "::error::one or more patches failed"; exit 1; }
          echo "==> Fuzz gate passed."

      - name: Stop after patching
        if: inputs.patch_only
        run: |
          echo "patch_only=true — stopping before compile."
          echo "Worst fuzz was: ${WORST_FUZZ}"
          echo ""
          echo "Re-run with patch_only=false to build."

      # ══════════════════════════════════════════════════════════
      # Build (only when patch_only=false)
      # ══════════════════════════════════════════════════════════
      - name: Restore Clang
        if: ${{ !inputs.patch_only }}
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}

      - name: Download Clang (cache miss)
        if: ${{ !inputs.patch_only && steps.cache-clang.outputs.cache-hit != 'true' }}
        run: |
          curl -sSfL --retry 3 --connect-timeout 30 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            || { echo "ERROR: clang download failed"; exit 1; }
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

      - name: Set up swap (24 GB)
        if: ${{ !inputs.patch_only }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Generate defconfig
        if: ${{ !inputs.patch_only }}
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 gki_defconfig

      - name: Enable configs
        if: ${{ !inputs.patch_only }}
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          ./scripts/config --file out/.config -e CONFIG_KSU

          KCFG="drivers/kernelsu/Kconfig"
          if [ -f "$KCFG" ]; then
            grep -oE '^config KSU_SUSFS[A-Z_]*' "$KCFG" | while read -r l; do
              ./scripts/config --file out/.config -e "CONFIG_${l#config }"
            done
          fi
          ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK || true

          if [ "${ZEROMOUNT_OK:-0}" = "1" ]; then
            ./scripts/config --file out/.config -e CONFIG_ZEROMOUNT
          fi

          ./scripts/config --file out/.config -d LTO_NONE       || true
          ./scripts/config --file out/.config -e LTO_CLANG      || true
          ./scripts/config --file out/.config -e LTO_CLANG_THIN || true
          ./scripts/config --file out/.config -d LTO_CLANG_FULL || true
          ./scripts/config --file out/.config -e CFI_CLANG      || true

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Verify config
        if: ${{ !inputs.patch_only }}
        run: |
          C=out/.config
          grep -q 'CONFIG_KSU=y' "$C" && echo "  ✅ CONFIG_KSU=y" || { echo "  ❌ CONFIG_KSU"; exit 1; }
          grep -q 'CONFIG_KSU_SUSFS=y' "$C" && echo "  ✅ CONFIG_KSU_SUSFS=y" || echo "  ⚠️  SUSFS off"
          [ "${ZEROMOUNT_OK:-0}" = "1" ] && { grep -q 'CONFIG_ZEROMOUNT=y' "$C" \
            && echo "  ✅ CONFIG_ZEROMOUNT=y" || echo "  ⚠️  ZEROMOUNT not set"; }
          grep -q 'CONFIG_LTO_CLANG_THIN=y' "$C" && echo "  ✅ ThinLTO" || echo "  ⚠️  not ThinLTO"
          grep -q 'CONFIG_CFI_CLANG=y' "$C" && echo "  ✅ CFI_CLANG=y" || echo "  ⚠️  CFI off"

      - name: Verify no yucca gate
        if: ${{ !inputs.patch_only }}
        run: |
          [ -f .yucca_token ] && { echo "::error::.yucca_token generated"; exit 1; } \
            || echo "  ✅ no .yucca_token"

      - name: Build kernel
        if: ${{ !inputs.patch_only }}
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Verify objects
        if: ${{ !inputs.patch_only }}
        run: |
          F=0
          find out/ -name 'susfs.o' | grep -q . && echo "  ✅ susfs.o" || { echo "  ❌ susfs.o"; F=1; }
          [ "${ZEROMOUNT_OK:-0}" = "1" ] && { find out/ -name 'zeromount.o' | grep -q . \
            && echo "  ✅ zeromount.o" || echo "  ⚠️  zeromount.o missing"; }
          ls out/arch/arm64/boot/Image* >/dev/null 2>&1 \
            && echo "  ✅ Image present" || { echo "  ❌ no Image"; F=1; }
          [ "$F" -eq 1 ] && exit 1 || echo "==> checks passed."

      - name: Metadata
        if: ${{ !inputs.patch_only }}
        id: meta
        run: |
          echo "kernelversion=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Package AnyKernel3
        if: ${{ !inputs.patch_only }}
        run: |
          AK=".own-repo/.github/goodies/AnyKernel3.zip"
          mkdir -p AnyKernel3
          if [ -f "$AK" ]; then unzip -q "$AK" -d AnyKernel3; fi
          cp out/arch/arm64/boot/Image* AnyKernel3/ 2>/dev/null || true
          {
            echo "SM8550 — EXP3"
            echo "Source     : ${{ inputs.kernel_repo }}"
            echo "Kernel     : ${{ steps.meta.outputs.kernelversion }}"
            echo "SUSFS src  : ${{ inputs.susfs_source }} (${SUSFS_SHA:-n/a})"
            echo "ZeroMount  : ${ZEROMOUNT_OK:-0}"
            echo "Worst fuzz : ${WORST_FUZZ}"
            echo ""
            echo "Back up boot first:"
            echo "  dd if=/dev/block/by-name/boot of=/sdcard/boot-backup.img"
          } > AnyKernel3/CHANGELOG.txt

      - name: Upload artifact
        if: ${{ !inputs.patch_only }}
        uses: actions/upload-artifact@v4
        with:
          name: EXP3-${{ inputs.susfs_source }}-${{ steps.meta.outputs.kernelversion }}-fuzz${{ env.WORST_FUZZ }}-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: warn

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && { echo "no webhook"; exit 0; }
          if [ "${{ job.status }}" = "failure" ]; then
            COLOR=15548997; ST="❌ EXP3 FAILED"
          else
            COLOR=10181046; ST="🧪 EXP3 OK"
          fi
          PAYLOAD=$(jq -n \
            --arg t "🧪 [EXP3] SM8550 — ${{ inputs.susfs_source }}" \
            --arg d "Fuzz measurement run. patch_only=${{ inputs.patch_only }}" \
            --arg s "$ST" \
            --arg f "📏 Worst fuzz: ${WORST_FUZZ:-n/a}" \
            --arg z "🧭 ZeroMount: ${ZEROMOUNT_OK:-0}" \
            --arg u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson c "$COLOR" \
            '{"embeds":[{"title":$t,"description":$d,"color":$c,"fields":[
              {"name":"Status","value":$s,"inline":false},
              {"name":"Fuzz","value":$f,"inline":true},
              {"name":"ZeroMount","value":$z,"inline":true},
              {"name":"Log","value":("[View](" + $u + ")"),"inline":false}],
              "footer":{"text":"SM8550 CI • EXP3"},
              "timestamp":(now|strftime("%Y-%m-%dT%H:%M:%SZ"))}]}')
          curl -sSf -H "Content-Type: application/json" -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" && echo sent || echo "notify failed"
