name: Build SM8550 Kernel (BakaSU)

# ══════════════════════════════════════════════════════════════════
#  Two-stage pipeline
#
#  1. check  — cheap (~1 min). Fetches commit history only for the
#              kernel, BakaSU and SUSFS, compares against the SHAs of
#              the last successful build, categorises the new commits
#              and calculates a flash priority.
#
#  2. build  — full compile. Only runs when:
#                * priority is anything other than SKIP, or
#                * there is no usable baseline (first run / cache lost), or
#                * it is a manual run with force_build ticked.
#              The build is PINNED to the exact SHAs the check job saw,
#              so the changelog always matches what was compiled.
#
#  Scheduled runs always build WITH SUSFS.
#  Manual runs let you choose SUSFS on/off.
#
#  When a run is skipped, the SHA baseline is NOT advanced, so minor
#  changes accumulate until something worth building arrives.
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily — adjust to match your old schedule
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: "Build with SUSFS"
        type: boolean
        default: true
      enable_bbg:
        description: "Build with Baseband-guard (scheduled builds always enable it)"
        type: boolean
        default: true
      force_build:
        description: "Build even if the priority is SKIP"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: sm8550-kernel-build
  cancel-in-progress: false

env:
  KERNEL_BRANCH: android13-5.15
  KSU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  KSU_SETUP_URL: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  BBG_REPO: https://github.com/vc-teahouse/Baseband-guard.git
  CLANG_VERSION: r584948
  # Scheduled runs always use SUSFS; manual runs follow the tickbox.
  ENABLE_SUSFS: ${{ github.event_name == 'schedule' || inputs.enable_susfs }}
  ENABLE_BBG: ${{ github.event_name == 'schedule' || inputs.enable_bbg }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ════════════════════════════════════════════════════════════════
  #  STAGE 1 — Check for changes and decide
  # ════════════════════════════════════════════════════════════════
  check:
    name: Check upstream changes
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      priority:     ${{ steps.decide.outputs.priority }}
      kernel_sha:   ${{ steps.decide.outputs.kernel_sha }}
      ksu_sha:      ${{ steps.decide.outputs.ksu_sha }}
      susfs_sha:    ${{ steps.decide.outputs.susfs_sha }}
      bbg_sha:      ${{ steps.decide.outputs.bbg_sha }}
      total_sec:    ${{ steps.decide.outputs.total_sec }}
      total_fix:    ${{ steps.decide.outputs.total_fix }}
      total_feat:   ${{ steps.decide.outputs.total_feat }}
      total_lts:    ${{ steps.decide.outputs.total_lts }}

    steps:
      # History only — no kernel source blobs are downloaded.
      - name: Checkout kernel history (lightweight)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 300
          filter: blob:none
          sparse-checkout: .github

      - name: Restore previous build SHAs
        uses: actions/cache/restore@v4
        with:
          path: .prev_build_shas
          key: build-shas-resukisu-
          restore-keys: build-shas-resukisu-

      - name: Fetch BakaSU, SUSFS and Baseband-guard history
        run: |
          git clone --quiet --filter=blob:none --no-checkout --branch main \
            "$KSU_REPO" ksu-src \
            || { echo "::error::BakaSU clone failed"; exit 1; }

          git clone --quiet --filter=blob:none --no-checkout -b "$SUSFS_BRANCH" \
            "$SUSFS_REPO" susfs-src \
            || git clone --quiet --no-checkout -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs-src \
            || { echo "::error::SUSFS clone failed"; exit 1; }
          git clone --quiet --filter=blob:none --no-checkout --branch main \
            "$BBG_REPO" bbg-src \
            || { echo "::error::Baseband-guard clone failed"; exit 1; }

      - name: Categorise changes and decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -uo pipefail

          prev() {
            [ -f .prev_build_shas ] || return 0
            grep "^$1=" .prev_build_shas | head -1 | cut -d= -f2- | tr -d "'" || true
          }
          PREV_KERNEL_SHA="$(prev PREV_KERNEL_SHA)"
          PREV_KSU_SHA="$(prev PREV_KSU_SHA)"
          PREV_SUSFS_SHA="$(prev PREV_SUSFS_SHA)"
          PREV_BBG_SHA="$(prev PREV_BBG_SHA)"
          PREV_DATE="$(prev PREV_DATE)"

          KERNEL_SHA="$(git rev-parse HEAD)"
          KSU_SHA="$(git -C ksu-src rev-parse HEAD)"
          SUSFS_SHA="$(git -C susfs-src rev-parse HEAD)"

          echo "==> Current : kernel ${KERNEL_SHA:0:12}  BakaSU ${KSU_SHA:0:12}  SUSFS ${SUSFS_SHA:0:12}"
          echo "==> Previous: kernel ${PREV_KERNEL_SHA:0:12}  BakaSU ${PREV_KSU_SHA:0:12}  SUSFS ${PREV_SUSFS_SHA:0:12}  (${PREV_DATE:-none})"

          BASELINE_OK=1

          # get_log <dir> <prev_sha> <outfile> [pathspec...]
          # Writes date|hash|subject lines. Returns 1 if the baseline
          # commit could not be found (falls back to last 15 commits).
          get_log() {
            local dir="$1" prv="$2" out="$3"; shift 3
            if [ -n "$prv" ] && git -C "$dir" cat-file -e "${prv}^{commit}" 2>/dev/null; then
              git -C "$dir" log --date=short --format='%ad|%h|%s' "${prv}..HEAD" -- "$@" > "$out"
              return 0
            fi
            git -C "$dir" log --date=short --format='%ad|%h|%s' -15 -- "$@" > "$out"
            return 1
          }

          # Kernel: ignore commits that only touch .github (workflow edits)
          get_log . "$PREV_KERNEL_SHA" /tmp/kernel.log . ':(exclude).github' || BASELINE_OK=0
          get_log ksu-src "$PREV_KSU_SHA" /tmp/ksu.log || BASELINE_OK=0
          SUSFS_BASE=1
          get_log susfs-src "$PREV_SUSFS_SHA" /tmp/susfs.log || SUSFS_BASE=0
          if [ "$ENABLE_SUSFS" = "true" ] && [ "$SUSFS_BASE" = 0 ]; then BASELINE_OK=0; fi
          BBG_BASE=1
          get_log bbg-src "$PREV_BBG_SHA" /tmp/bbg.log || BBG_BASE=0
          if [ "$ENABLE_BBG" = "true" ] && [ "$BBG_BASE" = 0 ]; then BASELINE_OK=0; fi

          # categorise <label> <logfile>  -> prints section, writes <logfile>.counts
          categorise() {
            local label="$1" file="$2"
            local sec=0 fix=0 feat=0 lts=0 other=0
            local sec_l="" fix_l="" feat_l="" lts_l="" oth_l="" d h m l
            while IFS='|' read -r d h m; do
              [ -n "${m:-}" ] || continue
              l="$(printf '%s' "$m" | tr '[:upper:]' '[:lower:]')"
              if echo "$l" | grep -qE 'security|cve-|vuln|overflow|use-after-free|oob|uaf|exploit|selinux fix'; then
                sec=$((sec+1)); sec_l+="    🔒 ${d}  ${h}  ${m}"$'\n'
              elif echo "$l" | grep -qE 'merge.*lts|merge.*5\.15\.|linux 5\.15\.|lts merge|upstream merge'; then
                lts=$((lts+1)); lts_l+="    🔄 ${d}  ${h}  ${m}"$'\n'
              elif echo "$l" | grep -qE 'fix|bug|crash|panic|null ptr|deadlock|race|hang|oops|regression|revert|resolve|repair'; then
                fix=$((fix+1)); fix_l+="    🐛 ${d}  ${h}  ${m}"$'\n'
              elif echo "$l" | grep -qE 'feat|add|support|implement|introduce|enable|new|enhance|improv|optim'; then
                feat=$((feat+1)); feat_l+="    ✨ ${d}  ${h}  ${m}"$'\n'
              else
                other=$((other+1)); oth_l+="    🔧 ${d}  ${h}  ${m}"$'\n'
              fi
            done < "$file"
            echo "  ${label}: ${sec} security, ${fix} bug fixes, ${feat} features, ${lts} LTS merges, ${other} other"
            [ -n "$sec_l" ]  && printf '  -- Security --\n%s' "$sec_l"
            [ -n "$fix_l" ]  && printf '  -- Bug Fixes --\n%s' "$fix_l"
            [ -n "$feat_l" ] && printf '  -- Features --\n%s' "$feat_l"
            [ -n "$lts_l" ]  && printf '  -- LTS / Upstream Merges --\n%s' "$lts_l"
            [ -n "$oth_l" ]  && printf '  -- Other --\n%s' "$oth_l"
            echo "$sec $fix $feat $lts $other" > "${file}.counts"
          }

          K_SECTION="$(categorise "Kernel" /tmp/kernel.log)"
          B_SECTION="$(categorise "BakaSU" /tmp/ksu.log)"
          S_SECTION="$(categorise "SUSFS" /tmp/susfs.log)"
          G_SECTION="$(categorise "Baseband-guard" /tmp/bbg.log)"

          read -r K_SEC K_FIX K_FEAT K_LTS K_OTH < /tmp/kernel.log.counts
          read -r B_SEC B_FIX B_FEAT B_LTS B_OTH < /tmp/ksu.log.counts
          read -r S_SEC S_FIX S_FEAT S_LTS S_OTH < /tmp/susfs.log.counts
          read -r G_SEC G_FIX G_FEAT G_LTS G_OTH < /tmp/bbg.log.counts

          # Optional component changes only matter when that component is enabled.
          if [ "$ENABLE_SUSFS" != "true" ]; then S_SEC=0; S_FIX=0; S_FEAT=0; S_LTS=0; fi
          if [ "$ENABLE_BBG" != "true" ]; then G_SEC=0; G_FIX=0; G_FEAT=0; G_LTS=0; fi

          TOTAL_SEC=$((K_SEC + B_SEC + S_SEC + G_SEC))
          TOTAL_FIX=$((K_FIX + B_FIX + S_FIX + G_FIX))
          TOTAL_FEAT=$((K_FEAT + B_FEAT + S_FEAT + G_FEAT))
          TOTAL_LTS=$((K_LTS + B_LTS + S_LTS + G_LTS))

          if [ "$TOTAL_SEC" -gt 0 ]; then
            LEVEL="FLASH NOW";   PRIORITY="🔴 FLASH NOW — Security patches detected"
          elif [ "$TOTAL_FIX" -gt 2 ] || [ "$TOTAL_LTS" -gt 0 ]; then
            LEVEL="RECOMMENDED"; PRIORITY="🟡 RECOMMENDED — Bug fixes or LTS merge"
          elif [ "$TOTAL_FEAT" -gt 0 ] || [ "$TOTAL_FIX" -gt 0 ]; then
            LEVEL="OPTIONAL";    PRIORITY="🟢 OPTIONAL — Minor improvements"
          else
            LEVEL="SKIP";        PRIORITY="⚪ SKIP — Maintenance only, no user-facing changes"
          fi

          # ── Decision ──
          SHOULD_BUILD=false
          if [ "$BASELINE_OK" != 1 ]; then
            SHOULD_BUILD=true; REASON="No usable baseline from a previous build — building to establish one"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${FORCE_BUILD:-false}" = "true" ]; then
            SHOULD_BUILD=true; REASON="Manual run with force_build"
          elif [ "$LEVEL" != "SKIP" ]; then
            SHOULD_BUILD=true; REASON="Priority is ${LEVEL}"
          else
            REASON="Priority is SKIP — no significant upstream changes since ${PREV_DATE:-last build}"
          fi

          echo ""
          echo "==> Priority : ${PRIORITY}"
          echo "==> Decision : build=${SHOULD_BUILD} (${REASON})"

          # ── CHANGELOG.txt (shipped in the AnyKernel3 zip) ──
          SINCE="since last build (${PREV_DATE:-n/a})"
          [ "$BASELINE_OK" = 1 ] || SINCE="last 15 commits (no baseline)"
          if [ "$ENABLE_SUSFS" = "true" ]; then SUSFS_LINE="${SUSFS_BRANCH} @ ${SUSFS_SHA:0:8}"; else SUSFS_LINE="disabled for this build"; fi
          if [ "$ENABLE_BBG" = "true" ]; then BBG_LINE="main @ ${BBG_SHA:0:8}"; else BBG_LINE="disabled for this build"; fi
          {
            echo "======================================================="
            echo "  SM8550 KERNEL BUILD — CHANGE SUMMARY"
            echo "======================================================="
            echo ""
            echo "  Build Date:     $(date '+%Y-%m-%d %H:%M UTC')"
            echo "  Root:           BakaSU (main)"
            echo "  Kernel:         ${KERNEL_BRANCH} @ ${KERNEL_SHA:0:9}"
            echo "  BakaSU:         ${KSU_SHA:0:8}"
            echo "  SUSFS:          ${SUSFS_LINE}"
            echo "  Baseband-guard: ${BBG_LINE}"
            [ -n "$PREV_DATE" ] && echo "  Previous Build: ${PREV_DATE}"
            echo ""
            echo "  +-------------------------------------------+"
            echo "  |  FLASH PRIORITY: ${PRIORITY}"
            echo "  +-------------------------------------------+"
            echo ""
            echo "-- KERNEL SOURCE (${SINCE}) -----------"
            echo "$K_SECTION"
            echo ""
            echo "-- BakaSU (${SINCE}) --------------"
            echo "$B_SECTION"
            echo ""
            echo "-- SUSFS (${SINCE}) ---------------------"
            if [ "$ENABLE_SUSFS" = "true" ]; then echo "$S_SECTION"; else echo "  Disabled for this build"; fi
            echo ""
            echo "-- BASEBAND-GUARD (${SINCE}) ------------"
            if [ "$ENABLE_BBG" = "true" ]; then echo "$G_SECTION"; else echo "  Disabled for this build"; fi
          } > CHANGELOG.txt

          {
            echo "## Upstream check"
            echo ""
            echo "| | Value |"
            echo "|---|---|"
            echo "| **Priority** | ${PRIORITY} |"
            echo "| **Decision** | build = \`${SHOULD_BUILD}\` — ${REASON} |"
            echo "| **SUSFS** | \`${ENABLE_SUSFS}\` |"
            echo ""
            echo '```'
            cat CHANGELOG.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "should_build=${SHOULD_BUILD}"
            echo "priority=${PRIORITY}"
            echo "reason=${REASON}"
            echo "kernel_sha=${KERNEL_SHA}"
            echo "ksu_sha=${KSU_SHA}"
            echo "susfs_sha=${SUSFS_SHA}"
            echo "bbg_sha=${BBG_SHA}"
            echo "total_sec=${TOTAL_SEC}"
            echo "total_fix=${TOTAL_FIX}"
            echo "total_feat=${TOTAL_FEAT}"
            echo "total_lts=${TOTAL_LTS}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload changelog for build job
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.txt
          retention-days: 3

      - name: Discord notification (skipped)
        if: steps.decide.outputs.should_build != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REASON: ${{ steps.decide.outputs.reason }}
          PRIORITY: ${{ steps.decide.outputs.priority }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "==> Discord webhook not configured — skipping notification."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg title "⏭️ SM8550 Kernel — build skipped" \
            --arg desc "$REASON" \
            --arg priority "$PRIORITY" \
            --arg url "$RUN_URL" \
            '{"embeds":[{"title":$title,"description":$desc,"color":9807270,
              "fields":[
                {"name":"Flash Priority","value":$priority,"inline":false},
                {"name":"Check Log","value":("[View on GitHub](" + $url + ")"),"inline":false}],
              "footer":{"text":"SM8550 Kernel CI • Upstream check"},
              "timestamp":(now|strftime("%Y-%m-%dT%H:%M:%SZ"))}]}')
          curl -sSf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            && echo "==> Discord notification sent." \
            || echo "WARNING: Discord notification failed (non-fatal)."

  # ════════════════════════════════════════════════════════════════
  #  STAGE 2 — Full build (only when the check says so)
  # ════════════════════════════════════════════════════════════════
  build:
    name: Build BakaSU kernel
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      KERNEL_SHA:     ${{ needs.check.outputs.kernel_sha }}
      KSU_SHA:        ${{ needs.check.outputs.ksu_sha }}
      SUSFS_SHA:      ${{ needs.check.outputs.susfs_sha }}
      BBG_SHA:        ${{ needs.check.outputs.bbg_sha }}
      FLASH_PRIORITY: ${{ needs.check.outputs.priority }}
      TOTAL_SEC:      ${{ needs.check.outputs.total_sec }}
      TOTAL_FIX:      ${{ needs.check.outputs.total_fix }}
      TOTAL_FEAT:     ${{ needs.check.outputs.total_feat }}
      TOTAL_LTS:      ${{ needs.check.outputs.total_lts }}
      CHANGELOG_PATH: CHANGELOG.txt

    steps:
      - name: Checkout kernel source (pinned)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.kernel_sha }}
          fetch-depth: 1

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip unzip \
            python3 python-is-python3 tar perl lz4 jq

      # ── Clang (cached; downloaded only if the cache was evicted) ──
      - name: Restore Clang from cache
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}

      - name: Download Clang (cache miss only)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 --connect-timeout 30 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${CLANG_VERSION}.tar.gz" \
            || { echo "::error::Clang download failed."; exit 1; }
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

      - name: Save Clang to cache
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      # ── BakaSU (pinned to the SHA the check job saw) ──
      - name: Set up BakaSU
        run: |
          echo "==> Setting up BakaSU @ ${KSU_SHA}..."
          curl -sSfL --retry 3 --connect-timeout 20 "$KSU_SETUP_URL" \
            | bash -s "$KSU_SHA" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          ACTUAL="$(git -C KernelSU rev-parse HEAD)"
          if [ "$ACTUAL" != "$KSU_SHA" ]; then
            echo "==> setup.sh left ${ACTUAL}; checking out pinned SHA explicitly..."
            git -C KernelSU fetch --quiet origin "$KSU_SHA" \
              && git -C KernelSU checkout --quiet "$KSU_SHA" \
              || { echo "::error::Could not check out BakaSU ${KSU_SHA}"; exit 1; }
          fi
          [ "$(git -C KernelSU rev-parse HEAD)" = "$KSU_SHA" ] \
            || { echo "::error::BakaSU pin verification failed"; exit 1; }
          echo "  ✅ BakaSU @ $(git -C KernelSU rev-parse --short HEAD)"

          KSU_TAG=$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null \
            || git -C KernelSU tag --list 'v[0-9]*' --sort=-v:refname 2>/dev/null | head -1)
          KSU_TAG="${KSU_TAG:-main}"

          if [ "$ENABLE_SUSFS" = "true" ]; then
            BUILD_SUFFIX="bakasu-${KSU_TAG}-susfs"
          else
            BUILD_SUFFIX="bakasu-${KSU_TAG}-nosusfs"
          fi
          echo "KSUDIR=KernelSU"            >> "$GITHUB_ENV"
          echo "KSU_TAG=${KSU_TAG}"         >> "$GITHUB_ENV"
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> "$GITHUB_ENV"

      - name: Dynamic header fixes
        run: |
          MAIN_MK="drivers/kernelsu/Makefile"
          if [ -f "${MAIN_MK}" ]; then
            if ! grep -q 'ccflags-y += -I$(srctree)/drivers/kernelsu' "${MAIN_MK}"; then
              printf '\nccflags-y += -I$(srctree)/drivers/kernelsu\n' >> "${MAIN_MK}"
            fi
          fi

          echo "==> Scanning for files missing ksu_cred declaration..."
          FILES=$(grep -rl 'ksu_cred' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern struct cred \*ksu_cred' "$file"; then
              { printf '#include <linux/cred.h>\nextern struct cred *ksu_cred;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing allow_shell declaration..."
          FILES=$(grep -rlE 'allow_shell|ksu_allow_shell' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -E -q 'extern.*allow_shell' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_allow_shell;\nextern bool allow_shell;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing ksu_late_loaded declaration..."
          FILES=$(grep -rl 'ksu_late_loaded' drivers/kernelsu/ fs/ kernel/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern bool ksu_late_loaded' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_late_loaded;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

      # ── SUSFS (pinned; skipped entirely when disabled) ──
      - name: Apply SUSFS patches
        if: env.ENABLE_SUSFS == 'true'
        run: |
          git clone --quiet -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu \
            || { echo "ERROR: SUSFS clone failed."; exit 1; }
          git -C susfs4ksu checkout --quiet "$SUSFS_SHA" \
            || { echo "ERROR: SUSFS commit ${SUSFS_SHA} not found."; exit 1; }
          echo "==> SUSFS @ $(git -C susfs4ksu rev-parse --short HEAD)"

          cp susfs4ksu/kernel_patches/fs/susfs.c                fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h     include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"

          if patch -p1 --forward --dry-run < "$SUSFS_PATCH" >/dev/null 2>&1; then
            patch -p1 --forward < "$SUSFS_PATCH"
          else
            echo "==> Strict apply failed; retrying with --fuzz=3..."
            patch -p1 --forward --fuzz=3 < "$SUSFS_PATCH" || true
          fi

          # ── Targeted port of fs/namespace.c hunk #1 (header block only) ──
          if [ -f fs/namespace.c.rej ]; then
            echo "==> Porting rejected fs/namespace.c header hunk manually..."
            python3 - <<'PY'
          import sys
          p = "fs/namespace.c"
          s = open(p).read()

          inc = ("#ifdef CONFIG_KSU_SUSFS\n"
                 "#include <linux/susfs_def.h>\n"
                 "#endif // #ifdef CONFIG_KSU_SUSFS\n\n")
          blk = ("#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                 "extern bool susfs_is_current_ksu_domain(void);\n"
                 "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n"
                 "#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n"
                 "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n")

          inc_anchor = '#include "pnode.h"'
          blk_anchor = "/* Maximum number of mounts in a mount namespace */"

          if "linux/susfs_def.h" not in s:
              if inc_anchor not in s:
                  sys.exit("ERROR: anchor '#include \"pnode.h\"' not found in fs/namespace.c")
              s = s.replace(inc_anchor, inc + inc_anchor, 1)

          if "susfs_is_sdcard_android_data_not_decrypted;" not in s:
              if blk_anchor not in s:
                  sys.exit("ERROR: anchor 'Maximum number of mounts' not found in fs/namespace.c")
              s = s.replace(blk_anchor, blk + blk_anchor, 1)

          open(p, "w").write(s)
          print("    fs/namespace.c header block inserted.")
          PY
            rm -f fs/namespace.c.rej fs/namespace.c.orig

            grep -q 'linux/susfs_def.h' fs/namespace.c \
              && grep -q 'CL_COPY_MNT_NS BIT(25)' fs/namespace.c \
              || { echo "ERROR: fs/namespace.c manual port failed"; exit 1; }
            echo "==> fs/namespace.c manual port verified."
          fi

          # ── Any OTHER rejects are still fatal ──
          REJECTS="$(find . -name '*.rej' -not -path './out/*' -not -path './susfs4ksu/*')"
          if [ -n "$REJECTS" ]; then
            echo "ERROR: SUSFS hunks still rejected:"
            for r in $REJECTS; do echo "--- $r ---"; cat "$r"; done
            exit 1
          fi
          echo "==> SUSFS main patch applied with no rejects."

          # ── Kconfig entries (only if BakaSU doesn't already ship them) ──
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          [ -f "$KSU_KCONFIG" ] || { echo "ERROR: KernelSU Kconfig not found at $KSU_KCONFIG"; exit 1; }
          if ! grep -q 'KSU_SUSFS' "$KSU_KCONFIG"; then
            echo "==> SUSFS Kconfig entries missing — extracting from susfs headers..."
            printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n\thelp\n\t  Patch for SUSFS on KernelSU\n' >> "$KSU_KCONFIG"
            SUSFS_OPTS=$(grep -hroE 'CONFIG_KSU_SUSFS_[A-Z_]+' susfs4ksu/kernel_patches/include/linux/susfs.h susfs4ksu/kernel_patches/fs/susfs.c 2>/dev/null | sort -u | sed 's/CONFIG_KSU_SUSFS_//')
            for opt in $SUSFS_OPTS; do
              DESC=$(echo "$opt" | tr '_' ' ' | tr '[:upper:]' '[:lower:]')
              printf '\nconfig KSU_SUSFS_%s\n\tbool "Enable %s"\n\tdepends on KSU_SUSFS\n\tdefault y\n' "$opt" "$DESC" >> "$KSU_KCONFIG"
            done
            echo "==> SUSFS Kconfig entries injected: $SUSFS_OPTS"
          else
            echo "==> SUSFS Kconfig entries already present."
          fi

          rm -rf susfs4ksu

      - name: Integrate Baseband-guard (pinned)
        if: env.ENABLE_BBG == 'true'
        run: |
          set -e
          echo "==> Integrating Baseband-guard @ ${BBG_SHA}..."
          BBG_SETUP="https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/${BBG_SHA}/setup.sh"
          curl -sSfL --retry 3 --connect-timeout 20 "$BBG_SETUP" | bash \
            || { echo "::error::Baseband-guard setup failed at ${BBG_SHA}"; exit 1; }
          grep -rqs 'config BBG' security/Kconfig security/*/Kconfig 2>/dev/null \
            || { echo "::error::CONFIG_BBG not found after Baseband-guard integration"; exit 1; }
          echo "  ✅ Baseband-guard integrated from audited SHA ${BBG_SHA:0:8}"
          echo "BUILDSUFFIX=${BUILDSUFFIX}-bbg" >> "$GITHUB_ENV"

      - name: Resolve kernel version
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)"  >> "$GITHUB_OUTPUT"

      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      - name: Configure KSU, SUSFS, Baseband-guard and LTO
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          ./scripts/config --file out/.config -e CONFIG_KSU

          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          if [ "$ENABLE_SUSFS" = "true" ]; then
            echo "==> Enabling all SUSFS config options..."
            grep -oE '^config KSU_SUSFS[A-Z_]*' "$KSU_KCONFIG" | while read -r line; do
              OPT="CONFIG_${line#config }"
              echo "  Enabling $OPT"
              ./scripts/config --file out/.config -e "$OPT"
            done
            # SUSFS on -> SUSFS inline hooks
            echo "==> Enabling manual hook mode..."
            ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK
          else
            echo "==> SUSFS disabled — turning off all KSU_SUSFS options..."
            grep -oE '^config KSU_SUSFS[A-Z_]*' "$KSU_KCONFIG" 2>/dev/null | while read -r line; do
              OPT="CONFIG_${line#config }"
              echo "  Disabling $OPT"
              ./scripts/config --file out/.config -d "$OPT"
            done
            ./scripts/config --file out/.config -d CONFIG_KSU_SUSFS
            # SUSFS off -> BakaSU default (tracepoint) hook mode
            echo "==> Using BakaSU default hook mode"
            ./scripts/config --file out/.config -d CONFIG_KSU_MANUAL_HOOK
          fi

          if [ "$ENABLE_BBG" = "true" ]; then
            echo "==> Enabling Baseband-guard..."
            ./scripts/config --file out/.config -e CONFIG_BBG
            CUR_LSM="$(grep '^CONFIG_LSM=' out/.config | cut -d'"' -f2)"
            [ -n "$CUR_LSM" ] || { echo "::error::CONFIG_LSM not found"; exit 1; }
            case ",${CUR_LSM}," in
              *,baseband_guard,*) NEW_LSM="$CUR_LSM" ;;
              *) NEW_LSM="${CUR_LSM},baseband_guard" ;;
            esac
            ./scripts/config --file out/.config --set-str CONFIG_LSM "$NEW_LSM"
          fi
          # ThinLTO: far lower memory than Full LTO (GitHub runners have 16 GB)
          ./scripts/config --file out/.config -d CONFIG_LTO_NONE
          ./scripts/config --file out/.config -e CONFIG_LTO
          ./scripts/config --file out/.config -e CONFIG_LTO_CLANG
          ./scripts/config --file out/.config -e CONFIG_LTO_CLANG_THIN
          ./scripts/config --file out/.config -d CONFIG_LTO_CLANG_FULL

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "==> Verifying kernel config options..."
          CONFIG="out/.config"
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          FAILED=0

          if grep -q 'CONFIG_KSU=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU=y"
          else
            echo "  ❌ CONFIG_KSU=y is MISSING!"; FAILED=1
          fi

          if [ "$ENABLE_SUSFS" = "true" ]; then
            if grep -q 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
              echo "  ✅ CONFIG_KSU_SUSFS=y"
            else
              echo "  ❌ CONFIG_KSU_SUSFS=y is MISSING!"; FAILED=1
            fi
            echo "  --- SUSFS sub-options ---"
            grep -oE '^config KSU_SUSFS_[A-Z_]+' "$KSU_KCONFIG" | while read -r line; do
              OPT="CONFIG_${line#config }"
              if grep -q "${OPT}=y" "$CONFIG"; then
                echo "  ✅ ${OPT}=y"
              else
                echo "  ⚠️  ${OPT}=y not set (may have been dropped by olddefconfig)"
              fi
            done
          else
            if grep -qE '^CONFIG_KSU_SUSFS(_[A-Z_]+)?=y' "$CONFIG"; then
              echo "  ❌ SUSFS is disabled for this build but SUSFS options are still enabled:"
              grep -E '^CONFIG_KSU_SUSFS(_[A-Z_]+)?=y' "$CONFIG"
              FAILED=1
            else
              echo "  ✅ SUSFS disabled (no CONFIG_KSU_SUSFS options set)"
            fi
          fi

          echo "  --- Baseband-guard ---"
          if [ "$ENABLE_BBG" = "true" ]; then
            grep -q '^CONFIG_BBG=y' "$CONFIG" && echo "  ✅ CONFIG_BBG=y" || { echo "  ❌ CONFIG_BBG missing"; FAILED=1; }
            grep '^CONFIG_LSM=' "$CONFIG" | grep -q 'baseband_guard' && echo "  ✅ baseband_guard in CONFIG_LSM" || { echo "  ❌ baseband_guard not in CONFIG_LSM"; FAILED=1; }
          else
            echo "  ℹ️  Baseband-guard disabled"
          fi
          echo "  --- LTO ---"
          grep -q 'CONFIG_LTO_CLANG_THIN=y' "$CONFIG" && echo "  ✅ ThinLTO" || echo "  ⚠️  ThinLTO not set"

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more CRITICAL config options are MISSING!"
            grep -E 'CONFIG_KSU' "$CONFIG" || echo "(none found)"
            exit 1
          fi
          echo "==> Config verification complete."

      - name: Apply fixes for missing KSU identifiers
        run: |
          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h
          echo "==> Headers patched successfully."

      - name: Create KSU hook bridge stubs
        run: |
          # Static keys are defined by BakaSU itself, so none are stubbed here.
          {
            echo '#include <linux/types.h>'
            echo '#include <linux/fs.h>'
            echo '#include <linux/version.h>'
            echo '#include <linux/jump_label.h>'
            echo 'int __attribute__((weak)) ksu_handle_sys_reboot(void) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_sys_read(unsigned int fd, char __user *buf, size_t count) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_vfs_fstat(int fd, struct kstat *stat) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_devpts(struct inode *inode) { return 0; }'
            echo 'int __attribute__((weak)) ksu_input_hook(void *dev, unsigned int type, unsigned int code, int value) { return 0; }'
            echo 'int __attribute__((weak)) ksu_execveat_hook(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_execveat_sucompat(int *fd, const char __user **filename_user, void *argv, void *envp, int *flags) { return 0; }'
            echo 'int __attribute__((weak)) ksu_init_rc_hook(const char *data, unsigned long count) { return 0; }'
            echo 'int __attribute__((weak)) ksu_install_su_fd(void) { return 0; }'
            echo 'bool __attribute__((weak)) susfs_is_current_ksu_domain(void) { return true; }'
            echo 'unsigned int __attribute__((weak)) susfs_ksu_sid;'
            echo 'unsigned int __attribute__((weak)) susfs_priv_app_sid;'
          } > kernel/ksu_hooks_bridge.c

          if ! grep -q 'ksu_hooks_bridge' kernel/Makefile; then
            echo 'obj-y += ksu_hooks_bridge.o' >> kernel/Makefile
          fi
          echo "==> Bridge stubs created."
          grep 'ksu_hooks_bridge' kernel/Makefile || echo "WARNING: Entry not found!"

      - name: Build kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Post-build verification
        run: |
          FAILED=0
          if [ "$ENABLE_SUSFS" = "true" ]; then
            if find out/ -name "susfs.o" | grep -q .; then
              echo "  ✅ fs/susfs.o found — SUSFS was compiled."
            else
              echo "  ❌ fs/susfs.o NOT found — SUSFS was NOT compiled!"; FAILED=1
            fi
          else
            echo "  ℹ️  SUSFS disabled — skipping susfs.o check."
          fi

          if [ "$ENABLE_BBG" = "true" ]; then
            BBG_OBJ="$(find out/security -type f -name '*.o' 2>/dev/null | grep -iE 'baseband|bbg' | head -5 || true)"
            [ -n "$BBG_OBJ" ] && { echo "  ✅ Baseband-guard object(s) found:"; echo "$BBG_OBJ" | sed 's/^/       /'; } \
              || { echo "  ❌ Baseband-guard object not found"; FAILED=1; }
          fi
          if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ]; then
            echo "  ✅ Kernel image found."
          else
            echo "  ❌ Kernel image NOT found!"; FAILED=1
          fi

          [ "$FAILED" -eq 1 ] && { echo "::error::Post-build verification FAILED!"; exit 1; }
          echo "==> All post-build checks passed."

      - name: Package AnyKernel3
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip -q AnyKernel3.zip -d AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found"; exit 1
          fi
          if [ -f "$CHANGELOG_PATH" ]; then
            cp "$CHANGELOG_PATH" AnyKernel3/
            echo "==> CHANGELOG.txt included in AnyKernel3 package."
          fi

      - name: Changelog summary
        run: |
          echo "========================================================"
          [ -f "$CHANGELOG_PATH" ] && cat "$CHANGELOG_PATH" || echo "  (No changelog)"
          echo "========================================================"
          echo "  VERDICT:  ${FLASH_PRIORITY}"
          echo "  Artifact: sm8550-${{ steps.meta.outputs.kernelversion }}-${BUILDSUFFIX}-${{ steps.meta.outputs.date }}"
          echo "========================================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: error

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "==> Discord webhook not configured — skipping notification."
            exit 0
          fi

          if [ "${{ job.status }}" = "failure" ]; then
            EMBED_COLOR=15548997; PRIORITY_LABEL="❌ BUILD FAILED — Check logs immediately"
          elif echo "$FLASH_PRIORITY" | grep -q "FLASH NOW"; then
            EMBED_COLOR=15548997; PRIORITY_LABEL="🔴 FLASH NOW — Security patches detected"
          elif echo "$FLASH_PRIORITY" | grep -q "RECOMMENDED"; then
            EMBED_COLOR=16776960; PRIORITY_LABEL="🟡 RECOMMENDED — Bug fixes or LTS merge"
          elif echo "$FLASH_PRIORITY" | grep -q "OPTIONAL"; then
            EMBED_COLOR=5763719;  PRIORITY_LABEL="🟢 OPTIONAL — Minor improvements"
          else
            EMBED_COLOR=9807270;  PRIORITY_LABEL="⚪ SKIP — Forced build, maintenance only"
          fi

          ARTIFACT="sm8550-${{ steps.meta.outputs.kernelversion }}-${BUILDSUFFIX:-unknown}-${{ steps.meta.outputs.date }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUSFS_STATE="Disabled"; [ "$ENABLE_SUSFS" = "true" ] && SUSFS_STATE="Enabled (${SUSFS_SHA:0:7})"
          BBG_STATE="Disabled"; [ "$ENABLE_BBG" = "true" ] && BBG_STATE="Enabled (${BBG_SHA:0:7})"

          PAYLOAD=$(jq -n \
            --arg title "🔔 SM8550 Kernel Build — BakaSU ${KSU_TAG:-}" \
            --arg desc "Automated build status notification." \
            --arg priority "$PRIORITY_LABEL" \
            --arg sec "🔒 Security: ${TOTAL_SEC:-0}" \
            --arg fix "🐛 Bug Fixes: ${TOTAL_FIX:-0}" \
            --arg feat "✨ Features: ${TOTAL_FEAT:-0}" \
            --arg lts "🔄 LTS Merges: ${TOTAL_LTS:-0}" \
            --arg susfs "$SUSFS_STATE" \
            --arg bbg "$BBG_STATE" \
            --arg artifact "$ARTIFACT" \
            --arg url "$RUN_URL" \
            --argjson color "$EMBED_COLOR" \
            '{
              "embeds": [{
                "title": $title,
                "description": $desc,
                "color": $color,
                "fields": [
                  { "name": "Flash Priority", "value": $priority, "inline": false },
                  { "name": "Security",       "value": $sec,      "inline": true  },
                  { "name": "Bug Fixes",      "value": $fix,      "inline": true  },
                  { "name": "Features",       "value": $feat,     "inline": true  },
                  { "name": "LTS Merges",     "value": $lts,      "inline": true  },
                  { "name": "SUSFS",          "value": $susfs,    "inline": true  },
                  { "name": "Baseband-guard", "value": $bbg,      "inline": true  },
                  { "name": "Artifact",       "value": $artifact, "inline": false },
                  { "name": "Build Log",      "value": ("[View on GitHub](" + $url + ")"), "inline": false }
                ],
                "footer": { "text": "SM8550 Kernel CI • Automated Build" },
                "timestamp": (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          curl -sSf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            && echo "==> Discord notification sent." \
            || echo "WARNING: Discord notification failed (non-fatal)."

      # ── Advance the baseline only after a successful build ──
      - name: Restore previous build SHAs
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: .prev_build_shas
          key: build-shas-resukisu-
          restore-keys: build-shas-resukisu-

      - name: Save build SHAs
        if: success()
        run: |
          # Keep the old SUSFS baseline if SUSFS wasn't part of this build
          if [ "$ENABLE_SUSFS" = "true" ]; then
            SAVE_SUSFS="$SUSFS_SHA"
          else
            SAVE_SUSFS=""
            [ -f .prev_build_shas ] && SAVE_SUSFS=$(grep '^PREV_SUSFS_SHA=' .prev_build_shas | cut -d= -f2- | tr -d "'" || true)
          fi
          if [ "$ENABLE_BBG" = "true" ]; then
            SAVE_BBG="$BBG_SHA"
          else
            SAVE_BBG=""
            [ -f .prev_build_shas ] && SAVE_BBG=$(grep '^PREV_BBG_SHA=' .prev_build_shas | cut -d= -f2- | tr -d "'" || true)
          fi
          {
            echo "PREV_KERNEL_SHA='${KERNEL_SHA}'"
            echo "PREV_KSU_SHA='${KSU_SHA}'"
            echo "PREV_SUSFS_SHA='${SAVE_SUSFS}'"
            echo "PREV_BBG_SHA='${SAVE_BBG}'"
            echo "PREV_DATE='$(date '+%Y-%m-%d %H:%M UTC')'"
          } > .prev_build_shas
          echo "==> Build SHAs saved for next run:"
          cat .prev_build_shas

      - name: Cache build SHAs
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .prev_build_shas
          key: build-shas-resukisu-${{ github.run_id }}
