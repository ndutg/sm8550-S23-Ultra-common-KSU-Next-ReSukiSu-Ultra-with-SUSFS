name: "[EXP7.1] SM8550 - pinned ReSukiSU + Super-Builders"

on:
  workflow_dispatch:
    inputs:
      patch_only:
        description: "Apply and audit patches only, without compiling"
        type: boolean
        default: true
      max_fuzz:
        description: "Maximum permitted fuzz (0-3, 99 disables the gate)"
        type: string
        default: "99"
      resukisu_pin:
        description: "ReSukiSU commit used by Super-Builders"
        type: string
        default: "47167aa7"

permissions:
  contents: read
  actions: write

env:
  KERNEL_REPO: yucca-a/kernel_samsung_sm8550
  KERNEL_REF: main
  OWN_REPO: ndutg/sm8550-S23-Ultra-common-KSU-Next-ReSukiSu-Ultra-with-SUSFS
  OWN_REF: android13-5.15
  ANDROID_VER: android13-5.15
  CLANG_VERSION: r584948
  SB_REPO: https://github.com/Enginex0/Super-Builders.git
  SB_COMMIT: c2cb71614868fe742cbffee2b6f3126523432673
  RESUKISU_SETUP: https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: "EXP7.1 ReSukiSU ${{ inputs.resukisu_pin }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/share/boost /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout clean kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_REF }}
          fetch-depth: 1

      - name: Checkout own repo for AnyKernel3
        if: ${{ !inputs.patch_only }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWN_REPO }}
          ref: ${{ env.OWN_REF }}
          fetch-depth: 1
          path: .own-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex \
            g++-multilib gcc-multilib git gnupg jq libelf-dev \
            liblz4-tool libssl-dev lz4 lzop pahole perl \
            python-is-python3 python3 rsync tar unzip zip zlib1g-dev

      - name: Fetch pinned Super-Builders patch set
        run: |
          git clone --quiet "${SB_REPO}" sb-src
          git -C sb-src checkout --quiet "${SB_COMMIT}"

          SB_DIR="sb-src/${ANDROID_VER}/ReSukiSU/patches"
          PIN_FILE="sb-src/${ANDROID_VER}/resukisu-pin.txt"

          test -d "$SB_DIR" || { echo "ERROR: Missing $SB_DIR"; exit 1; }
          test -f "$PIN_FILE" || { echo "ERROR: Missing $PIN_FILE"; exit 1; }

          REPO_PIN="$(tr -d '[:space:]' < "$PIN_FILE")"
          echo "Super-Builders commit : $(git -C sb-src rev-parse HEAD)"
          echo "Super-Builders date   : $(git -C sb-src log -1 --format=%ci)"
          echo "Repository pin        : ${REPO_PIN}"
          echo "Requested pin         : ${{ inputs.resukisu_pin }}"

          if [ "$REPO_PIN" != "${{ inputs.resukisu_pin }}" ]; then
            echo "::warning::Input pin differs from Super-Builders resukisu-pin.txt"
          fi

          echo "SB_DIR=${SB_DIR}" >> "$GITHUB_ENV"
          echo "REPO_PIN=${REPO_PIN}" >> "$GITHUB_ENV"
          ls -la "$SB_DIR"

      - name: Setup and pin ReSukiSU exactly like Super-Builders
        run: |
          # setup.sh may not expose the historical susfs-ksud branch anymore.
          # Use main only to create the integration, then detach to the exact
          # SHA from Super-Builders resukisu-pin.txt.
          curl -sSfL --retry 3 --connect-timeout 20 "${RESUKISU_SETUP}" \
            | bash -s main

          test -d KernelSU/.git || { echo "ERROR: KernelSU repo was not created"; exit 1; }

          git -C KernelSU fetch --all --tags --prune
          git -C KernelSU checkout --detach "${{ inputs.resukisu_pin }}"

          ACTUAL_SHA="$(git -C KernelSU rev-parse --short=8 HEAD)"
          ACTUAL_FULL="$(git -C KernelSU rev-parse HEAD)"
          ACTUAL_DATE="$(git -C KernelSU log -1 --format=%ci)"
          KSU_TAG="$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo pinned)"

          echo "Requested pin : ${{ inputs.resukisu_pin }}"
          echo "Actual SHA    : ${ACTUAL_FULL}"
          echo "Actual date   : ${ACTUAL_DATE}"
          echo "Nearest tag   : ${KSU_TAG}"

          case "$ACTUAL_FULL" in
            "${{ inputs.resukisu_pin }}"*) ;;
            *) echo "ERROR: ReSukiSU checkout does not match requested pin"; exit 1 ;;
          esac

          if [ -L drivers/kernelsu ]; then
            test -d drivers/kernelsu || { echo "ERROR: drivers/kernelsu symlink is dangling"; exit 1; }
          elif [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu is missing"
            exit 1
          fi

          echo "KSU_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "KSU_TAG=${KSU_TAG}" >> "$GITHUB_ENV"

      - name: Remove yucca ROM gate from this independent build
        run: |
          echo "Yucca gate references before removal:"
          grep -rnE 'YUCCA_ROM_GATE|early_assert|yucca_gate_token' \
            drivers/ init/ kernel/ security/ fs/ 2>/dev/null || true

          if grep -q 'early_assert' drivers/misc/Makefile 2>/dev/null; then
            sed -i '/early_assert/d' drivers/misc/Makefile
          fi
          rm -f drivers/misc/early_assert.c

          REMAINING="$(grep -rln 'yucca_gate_token' drivers/ init/ kernel/ security/ fs/ 2>/dev/null || true)"
          if [ -n "$REMAINING" ]; then
            echo "ERROR: yucca gate token consumers remain:"
            echo "$REMAINING"
            exit 1
          fi
          echo "Yucca gate source removed."

      - name: Apply Super-Builders patches in recommended order
        run: |
          : > /tmp/fuzz_summary
          mkdir -p /tmp/fuzzlogs
          ROOT="$(pwd)"
          SB_ABS="${ROOT}/${SB_DIR}"

          apply_patch() {
            local label="$1"
            local patch_file="$2"
            local workdir="${3:-$ROOT}"
            local log="/tmp/fuzzlogs/${label}.log"
            local rc=0 max_fuzz=0 lvl rejects

            echo ""
            echo "=================================================="
            echo "Applying ${label}"
            echo "Patch: ${patch_file}"
            echo "Workdir: ${workdir}"
            echo "=================================================="

            test -f "$patch_file" || { echo "${label}:X:missing" >> /tmp/fuzz_summary; return 1; }
            test -d "$workdir" || { echo "${label}:X:no-workdir" >> /tmp/fuzz_summary; return 1; }

            touch "/tmp/${label}.timestamp"
            pushd "$workdir" >/dev/null
            patch -p1 --batch --forward --fuzz=3 --no-backup-if-mismatch \
              < "$patch_file" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            popd >/dev/null

            if grep -qE "hunks? ignored|Skipping patch|can't find file to patch|No file to patch" "$log"; then
              echo "${label}:X:skipped" >> /tmp/fuzz_summary
              return 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "${label}:X:failed" >> /tmp/fuzz_summary
              return 1
            fi

            rejects="$(find "$workdir" -name '*.rej' -newer "/tmp/${label}.timestamp" 2>/dev/null || true)"
            if [ -n "$rejects" ]; then
              echo "$rejects"
              echo "${label}:X:rejects" >> /tmp/fuzz_summary
              return 1
            fi

            for lvl in 1 2 3; do
              if grep -q "with fuzz ${lvl}" "$log"; then max_fuzz=$lvl; fi
            done

            if [ "$max_fuzz" -eq 0 ]; then
              echo "${label}:0:clean" >> /tmp/fuzz_summary
            else
              echo "${label}:${max_fuzz}:fuzzed" >> /tmp/fuzz_summary
            fi
          }

          P50="${SB_ABS}/50_add_susfs_in_gki-${ANDROID_VER}.patch"
          P51="${SB_ABS}/51_enhanced_susfs-${ANDROID_VER}.patch"
          P70="${SB_ABS}/70_ksu_safety-resukisu-5.15.patch"
          P60="${SB_ABS}/60_zeromount-${ANDROID_VER}.patch"

          # Same sequence shown by Super-Builders' ReSukiSU job.
          apply_patch 50_susfs "$P50" "$ROOT" || exit 1
          apply_patch 51_enhanced "$P51" "$ROOT" || exit 1

          # 70_ contains kernel/supercalls.c relative to the KernelSU repository,
          # so it must be applied from ${ROOT}/KernelSU rather than the kernel root.
          apply_patch 70_ksu_safety "$P70" "${ROOT}/KernelSU" || exit 1
          echo "KSU_SAFETY_OK=1" >> "$GITHUB_ENV"

          apply_patch 60_zeromount "$P60" "$ROOT" || exit 1
          echo "ZEROMOUNT_OK=1" >> "$GITHUB_ENV"

          echo ""
          echo "Patch summary:"
          cat /tmp/fuzz_summary

      - name: Audit hooks and required source files
        run: |
          echo "=================================================="
          echo "HOOK COMPATIBILITY AUDIT"
          echo "=================================================="

          BAD=0

          reject_old_hook() {
            local symbol="$1" file="$2"
            if [ -f "$file" ] && grep -q -- "$symbol" "$file"; then
              echo "OLD HOOK PRESENT: $symbol in $file"
              BAD=1
            else
              echo "OK old hook absent: $symbol in $file"
            fi
          }

          require_hook() {
            local symbol="$1" file="$2"
            if [ -f "$file" ] && grep -q -- "$symbol" "$file"; then
              echo "OK required hook present: $symbol in $file"
            else
              echo "REQUIRED HOOK MISSING: $symbol in $file"
              BAD=1
            fi
          }

          # Read the selected ReSukiSU's own checks for the authoritative list.
          echo "Selected inline_hook_check.mk:"
          sed -n '1,180p' KernelSU/kernel/inline_hook_check.mk 2>/dev/null || true

          reject_old_hook ksu_vfs_read_hook fs/read_write.c
          reject_old_hook ksu_input_hook drivers/input/input.c
          reject_old_hook ksu_execveat_hook fs/exec.c
          reject_old_hook ksu_init_rc_hook fs/read_write.c
          reject_old_hook ksu_init_rc_hook fs/stat.c

          require_hook ksu_handle_setresuid kernel/sys.c
          require_hook ksu_handle_execveat fs/exec.c
          require_hook ksu_handle_faccessat fs/open.c
          require_hook ksu_handle_sys_read fs/read_write.c
          require_hook ksu_handle_stat fs/stat.c
          require_hook ksu_handle_sys_reboot kernel/reboot.c
          require_hook ksu_handle_input_handle_event drivers/input/input.c

          test -f fs/susfs.c || { echo "Missing fs/susfs.c"; BAD=1; }
          test -f include/linux/susfs.h || { echo "Missing include/linux/susfs.h"; BAD=1; }
          test -f fs/zeromount.c || { echo "Missing fs/zeromount.c"; BAD=1; }
          test -f include/linux/zeromount.h || { echo "Missing include/linux/zeromount.h"; BAD=1; }
          grep -q zeromount fs/Makefile || { echo "Missing fs/Makefile ZeroMount entry"; BAD=1; }
          grep -q ZEROMOUNT fs/Kconfig || { echo "Missing fs/Kconfig ZeroMount entry"; BAD=1; }

          if [ "$BAD" -ne 0 ]; then
            echo "ERROR: Hook/source audit failed. Do not compile this combination."
            exit 1
          fi
          echo "Hook/source audit passed."

      - name: Enforce fuzz limit
        run: |
          WORST=0
          FAILED=0

          while IFS=: read -r label fuzz result; do
            [ -n "$label" ] || continue
            printf '%-20s %-8s %s\n' "$label" "$fuzz" "$result"
            case "$fuzz" in
              [0-3]) if [ "$fuzz" -gt "$WORST" ]; then WORST=$fuzz; fi ;;
              *) FAILED=1 ;;
            esac
            case "$result" in
              clean|fuzzed) ;;
              *) FAILED=1 ;;
            esac
          done < /tmp/fuzz_summary

          echo "Worst fuzz: ${WORST}"
          echo "WORST_FUZZ=${WORST}" >> "$GITHUB_ENV"

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more patches failed"
            exit 1
          fi

          MAX="${{ inputs.max_fuzz }}"
          if [ "$MAX" != "99" ] && [ "$WORST" -gt "$MAX" ]; then
            echo "ERROR: Worst fuzz ${WORST} exceeds limit ${MAX}"
            exit 1
          fi

      - name: Stop after patch audit
        if: inputs.patch_only
        run: |
          echo "patch_only=true"
          echo "Pinned ReSukiSU: ${KSU_SHA}"
          echo "Worst fuzz: ${WORST_FUZZ}"
          echo "Patch and hook audits passed."

      - name: Restore Clang cache
        if: ${{ !inputs.patch_only }}
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key: exp7-clang-${{ env.CLANG_VERSION }}

      - name: Download Clang on cache miss
        if: ${{ !inputs.patch_only && steps.cache-clang.outputs.cache-hit != 'true' }}
        run: |
          curl -sSfL --retry 3 --connect-timeout 30 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${CLANG_VERSION}.tar.gz"
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

      - name: Set up swap
        if: ${{ !inputs.patch_only }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Generate and configure defconfig
        if: ${{ !inputs.patch_only }}
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 gki_defconfig

          ./scripts/config --file out/.config -e CONFIG_KSU
          ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK || true

          # Enable every SUSFS symbol declared by the final assembled Kconfig.
          grep -rhoE '^config KSU_SUSFS[A-Z_]*' fs/Kconfig drivers/kernelsu/Kconfig 2>/dev/null \
            | sort -u | while read -r line; do
                symbol="CONFIG_${line#config }"
                echo "Enabling ${symbol}"
                ./scripts/config --file out/.config -e "$symbol"
              done

          ./scripts/config --file out/.config -e CONFIG_ZEROMOUNT
          ./scripts/config --file out/.config -d LTO_NONE || true
          ./scripts/config --file out/.config -e LTO_CLANG || true
          ./scripts/config --file out/.config -e LTO_CLANG_THIN || true
          ./scripts/config --file out/.config -d LTO_CLANG_FULL || true
          ./scripts/config --file out/.config -e CFI_CLANG || true

          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Verify final config
        if: ${{ !inputs.patch_only }}
        run: |
          CONFIG=out/.config
          FAILED=0

          require_config() {
            local symbol="$1"
            if grep -q "^${symbol}=y$" "$CONFIG"; then
              echo "OK ${symbol}=y"
            else
              echo "MISSING ${symbol}=y"
              FAILED=1
            fi
          }

          require_config CONFIG_KSU
          require_config CONFIG_KSU_SUSFS
          require_config CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
          require_config CONFIG_ZEROMOUNT
          require_config CONFIG_LTO_CLANG_THIN
          require_config CONFIG_CFI_CLANG

          grep -E '^CONFIG_KSU_SUSFS[A-Z_]*=y$' "$CONFIG" || true
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Verify yucca gate remains disabled
        if: ${{ !inputs.patch_only }}
        run: |
          test ! -f .yucca_token || { echo "ERROR: .yucca_token exists"; exit 1; }
          ! grep -rq 'yucca_gate_token' drivers/ init/ kernel/ security/ fs/ \
            || { echo "ERROR: yucca gate reference returned"; exit 1; }
          echo "Yucca gate is absent."

      - name: Build kernel
        if: ${{ !inputs.patch_only }}
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Verify build outputs
        if: ${{ !inputs.patch_only }}
        run: |
          FAILED=0
          find out -name susfs.o -print -quit | grep -q . || { echo "Missing susfs.o"; FAILED=1; }
          find out -name zeromount.o -print -quit | grep -q . || { echo "Missing zeromount.o"; FAILED=1; }
          if ls out/arch/arm64/boot/Image* >/dev/null 2>&1; then
            ls -la out/arch/arm64/boot/Image*
          else
            echo "Missing kernel Image"
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Resolve metadata
        if: ${{ !inputs.patch_only }}
        id: meta
        run: |
          echo "kernelversion=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Package AnyKernel3
        if: ${{ !inputs.patch_only }}
        run: |
          mkdir -p AnyKernel3
          AK=".own-repo/.github/goodies/AnyKernel3.zip"
          if [ -f "$AK" ]; then unzip -q "$AK" -d AnyKernel3; fi
          cp out/arch/arm64/boot/Image* AnyKernel3/
          cat > AnyKernel3/CHANGELOG.txt <<EOF
          SM8550 EXP7.1
          Kernel: ${{ steps.meta.outputs.kernelversion }}
          Kernel source: ${KERNEL_REPO}@${KERNEL_REF}
          ReSukiSU pin: ${{ inputs.resukisu_pin }} (${KSU_SHA})
          Super-Builders: ${SB_COMMIT}
          ZeroMount: ${ZEROMOUNT_OK:-0}
          KSU safety patch: ${KSU_SAFETY_OK:-0}
          Worst fuzz: ${WORST_FUZZ}
          EOF

      - name: Upload artifact
        if: ${{ !inputs.patch_only }}
        uses: actions/upload-artifact@v4
        with:
          name: EXP7.1-sm8550-${{ steps.meta.outputs.kernelversion }}-ksu${{ env.KSU_SHA }}-fuzz${{ env.WORST_FUZZ }}-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## EXP7.1 pinned build"
            echo ""
            echo "- Kernel source: \`${KERNEL_REPO}@${KERNEL_REF}\`"
            echo "- Requested ReSukiSU pin: \`${{ inputs.resukisu_pin }}\`"
            echo "- Actual ReSukiSU SHA: \`${KSU_SHA:-n/a}\`"
            echo "- Super-Builders SHA: \`${SB_COMMIT}\`"
            echo "- ZeroMount: \`${ZEROMOUNT_OK:-0}\`"
            echo "- KSU safety patch: \`${KSU_SAFETY_OK:-0}\`"
            echo "- Worst fuzz: \`${WORST_FUZZ:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"
