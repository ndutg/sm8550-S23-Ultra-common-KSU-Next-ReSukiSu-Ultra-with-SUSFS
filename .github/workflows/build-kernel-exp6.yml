name: Build SM8550 ReSukiSU without Yucca gate

on:
  workflow_dispatch:
    inputs:
      yucca_ref:
        description: "Yucca kernel branch, tag, or commit"
        required: true
        default: "main"
        type: string
      mode:
        description: "Build mode"
        required: true
        default: "resukisu"
        type: choice
        options:
          - resukisu
          - lkm

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: SM8550 ${{ inputs.mode }} no-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/share/boost /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout Yucca kernel source
        uses: actions/checkout@v4
        with:
          repository: yucca-a/kernel_samsung_sm8550
          ref: ${{ inputs.yucca_ref }}
          fetch-depth: 1
          path: kernel

      - name: Checkout packaging source
        uses: actions/checkout@v4
        with:
          path: packaging-source
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex \
            g++-multilib gcc-multilib git gnupg jq libelf-dev \
            liblz4-tool libssl-dev lz4 lzop pahole perl \
            python-is-python3 python3 rsync tar unzip zip zlib1g-dev

      - name: Create swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          AK_ARCHIVE="${GITHUB_WORKSPACE}/packaging-source/.github/goodies/AnyKernel3.zip"
          AK_DIR="${GITHUB_WORKSPACE}/kernel/anykernel3"

          test -s "$AK_ARCHIVE" || {
            echo "::error::AnyKernel3 archive not found: $AK_ARCHIVE"
            exit 1
          }

          rm -rf "$AK_DIR"
          mkdir -p "$AK_DIR"
          unzip -q "$AK_ARCHIVE" -d "$AK_DIR"

          if [ ! -f "$AK_DIR/anykernel.sh" ]; then
            WRAPPER="$(find "$AK_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            if [ -n "$WRAPPER" ] && [ -f "$WRAPPER/anykernel.sh" ]; then
              TMP="${GITHUB_WORKSPACE}/anykernel-flat"
              rm -rf "$TMP"
              mkdir -p "$TMP"
              cp -a "$WRAPPER/." "$TMP/"
              rm -rf "$AK_DIR"
              mv "$TMP" "$AK_DIR"
            fi
          fi

          test -s "$AK_DIR/anykernel.sh" || { echo "::error::anykernel.sh missing"; exit 1; }
          test -d "$AK_DIR/META-INF" || { echo "::error::META-INF missing"; exit 1; }
          test -d "$AK_DIR/tools" || { echo "::error::tools missing"; exit 1; }

          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          echo "ANYKERNEL_DIR=$AK_DIR" >> "$GITHUB_ENV"

      - name: Disable Yucca token gate in build pipeline
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          ENTRY="scripts/build/build.sh"
          test -f "$ENTRY" || {
            echo "::error::Yucca build entrypoint missing: $ENTRY"
            exit 1
          }

          echo "Gate-related source references before adjustment:"
          grep -RInE 'Yucca gate|yucca_gate_token|early_assert|\.yucca_token' \
            scripts drivers/misc 2>/dev/null || true

          # The native script performs clean-worktree checks before it generates
          # the token. Insert the removal immediately after its unique
          # "burnt into header" line, before feature patching and compilation.
          TARGETS="$(grep -RIl 'burnt into header' scripts/build 2>/dev/null || true)"
          COUNT="$(printf '%s\n' "$TARGETS" | sed '/^$/d' | wc -l)"

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected one Yucca gate-generation script, found $COUNT"
            printf '%s\n' "$TARGETS"
            exit 1
          fi

          TARGET="$(printf '%s\n' "$TARGETS" | sed '/^$/d' | head -1)"
          cp "$TARGET" "${TARGET}.original"

          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          marker = "burnt into header"
          matches = [i for i, line in enumerate(lines) if marker in line]
          if len(matches) != 1:
              raise SystemExit(f"expected one marker, found {len(matches)}")

          i = matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          injected = [
              f'{indent}YUCCA_TREE="$(git rev-parse --show-toplevel)"',
              f'{indent}echo "[*] Independent build: removing Yucca ROM token gate"',
              f'{indent}sed -i \'/early_assert/d\' "$YUCCA_TREE/drivers/misc/Makefile"',
              f'{indent}rm -f "$YUCCA_TREE/drivers/misc/early_assert.c"',
              f'{indent}rm -f "$YUCCA_TREE/drivers/misc/yucca_gate_token.h"',
              f'{indent}rm -f "$YUCCA_TREE/.yucca_token"',
              f'{indent}if grep -q \'early_assert\' "$YUCCA_TREE/drivers/misc/Makefile"; then',
              f'{indent}  echo "[-] Failed to remove early_assert from drivers/misc/Makefile"',
              f'{indent}  exit 1',
              f'{indent}fi',
          ]
          lines[i + 1:i + 1] = injected
          path.write_text("\n".join(lines) + "\n")
          PY

          bash -n "$TARGET"
          echo "Adjusted script: $TARGET"
          grep -n -A12 -B2 'Independent build: removing Yucca ROM token gate' "$TARGET"

      - name: Run native Yucca build
        id: build
        shell: bash
        working-directory: kernel
        env:
          BUILD_MODE: ${{ inputs.mode }}
          ANYKERNEL_DIR: ${{ env.ANYKERNEL_DIR }}
        run: |
          set -o pipefail
          chmod +x scripts/build/build.sh
          ./scripts/build/build.sh "$BUILD_MODE" 2>&1 | tee "${GITHUB_WORKSPACE}/kernel-build.log"

      - name: Verify token gate is absent from compiled output
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          OUT="out/${{ inputs.mode }}"
          IMAGE="$OUT/arch/arm64/boot/Image"
          REPORT="${GITHUB_WORKSPACE}/build-report.txt"

          test -s "$IMAGE" || { echo "::error::Kernel Image missing"; exit 1; }

          test ! -e .yucca_token || {
            echo "::error::.yucca_token still exists"
            exit 1
          }

          test ! -e drivers/misc/early_assert.c || {
            echo "::error::early_assert.c still exists"
            exit 1
          }

          if grep -q 'early_assert' drivers/misc/Makefile 2>/dev/null; then
            echo "::error::early_assert remains in drivers/misc/Makefile"
            exit 1
          fi

          if find "$OUT" -type f -name 'early_assert.o' -print -quit | grep -q .; then
            echo "::error::early_assert.o was compiled"
            exit 1
          fi

          if strings "$IMAGE" | grep -qE 'yucca_gate_token|YUCCA_ROM_GATE|early_assert'; then
            echo "::error::Yucca gate marker found in compiled Image"
            exit 1
          fi

          RESUKISU_CODE="$(grep -Eo 'ReSukiSU version code: [0-9]+' "${GITHUB_WORKSPACE}/kernel-build.log" | tail -1 | awk '{print $4}')"
          RESUKISU_NAME="$(grep -E 'ReSukiSU version name:' "${GITHUB_WORKSPACE}/kernel-build.log" | tail -1 | sed 's/^.*ReSukiSU version name:[[:space:]]*//')"
          SUSFS_VERSION="$(grep -E 'SUSFS_VERSION:' "${GITHUB_WORKSPACE}/kernel-build.log" | tail -1 | sed 's/^.*SUSFS_VERSION:[[:space:]]*//')"

          {
            echo "SM8550 BUILD REPORT"
            echo "==================="
            echo "Yucca source: $(git rev-parse HEAD)"
            echo "Kernel version: $(make -s kernelversion)"
            echo "ReSukiSU code: ${RESUKISU_CODE:-unknown}"
            echo "ReSukiSU name: ${RESUKISU_NAME:-unknown}"
            echo "SUSFS version: ${SUSFS_VERSION:-unknown}"
            echo "Yucca token file: absent"
            echo "early_assert source: absent"
            echo "early_assert object: absent"
            echo "Gate marker in Image: absent"
          } | tee "$REPORT"

      - name: Select and validate flashable ZIP
        id: package
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          OUT="out/${{ inputs.mode }}"
          ZIP_PATH="$(find "$OUT" -maxdepth 1 -type f -name 'SM8550_*.zip' -print -quit)"

          test -n "$ZIP_PATH" && test -s "$ZIP_PATH" || {
            echo "::error::Flashable ZIP not found under $OUT"
            find "$OUT" -maxdepth 3 -type f -print | sort
            exit 1
          }

          unzip -t "$ZIP_PATH"
          unzip -Z1 "$ZIP_PATH" | grep -qx 'anykernel.sh' || { echo "::error::anykernel.sh not at ZIP root"; exit 1; }
          unzip -Z1 "$ZIP_PATH" | grep -q '^META-INF/' || { echo "::error::META-INF missing"; exit 1; }
          unzip -Z1 "$ZIP_PATH" | grep -q '^tools/' || { echo "::error::tools missing"; exit 1; }
          unzip -Z1 "$ZIP_PATH" | grep -Eq '^(Image|Image.gz|Image.gz-dtb)$' || { echo "::error::kernel Image missing"; exit 1; }

          ZIP_ABS="$(realpath "$ZIP_PATH")"
          ZIP_NAME="$(basename "$ZIP_PATH" .zip)"
          echo "zip_path=$ZIP_ABS" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Validated flashable ZIP: $ZIP_ABS"
          ls -lh "$ZIP_ABS"

      - name: Upload flashable ZIP only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload compact build report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}-report
          path: build-report.txt
          compression-level: 9
          if-no-files-found: error

      - name: Upload log only if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-failed-build-log-${{ github.run_number }}
          path: kernel-build.log
          compression-level: 9
          if-no-files-found: warn
