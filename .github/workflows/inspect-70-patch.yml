# ══════════════════════════════════════════════════════════════════
#  70_ksu_safety — NATIVE PORT for ReSukiSU v4.2.0-rc2
#
#  Replaces the 70_ block inside the "Apply patch stack and measure"
#  step of build-kernel-exp4.yml. Indentation: 10 spaces, already set.
#
#  ── WHY THE ORIGINAL PATCH CANNOT BE USED AS-IS ──────────────────
#
#  The inspector run established three facts:
#
#  1. The dispatcher MOVED:
#       kernel/supercalls.c  ->  kernel/supercall/dispatch.c  (1434 lines)
#
#  2. The dispatcher was REWRITTEN from an if-chain to a switch:
#       patch expects:   if (cmd == CMD_X) { ... }
#       rc2 actually has: case CMD_X: { ... }
#     So even a corrected path would still reject — the body is the
#     wrong C construct.
#
#  3. Hunk 1 of the patch is IRRELEVANT here:
#       -#ifdef KSU_TP_HOOK
#       +#if defined(KSU_TP_HOOK) && defined(CONFIG_KSU_SUSFS)
#     It guards ksu_mark_running_process() for builds WITHOUT SUSFS.
#     We always enable CONFIG_KSU_SUSFS, so it is a no-op for us.
#     Only hunk 2 carries real functionality.
#
#  ── WHAT THIS DOES INSTEAD ───────────────────────────────────────
#  Inserts hunk 2's logic in rc2's native switch-case form, anchored
#  on the exact line that terminates the KSTAT block:
#       #endif //#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
#
#  Every precondition is verified before touching anything, and the
#  result is syntax-checked afterwards. Non-fatal throughout.
#
#  ── CORRECTION TO EARLIER ADVICE ─────────────────────────────────
#  I previously suggested injecting CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT
#  into drivers/kernelsu/Kconfig. That was WRONG and is NOT done here.
#  51_enhanced already declares it in fs/Kconfig (51_ line 9). My
#  earlier grep only checked drivers/kernelsu/Kconfig, producing a
#  false negative. No Kconfig changes are needed.
# ══════════════════════════════════════════════════════════════════

          # ══ NATIVE 70_ PORT ══════════════════════════════════════
          if [ "${{ inputs.apply_70 }}" = "true" ]; then
            echo ""
            echo "────────────────────────────────────────────────"
            echo "  NATIVE PORT: 70_ksu_safety (hunk 2)"
            echo "────────────────────────────────────────────────"

            DISPATCH="${ROOT}/KernelSU/kernel/supercall/dispatch.c"
            PORT_OK=1

            # ── Precondition 1: dispatcher exists ──
            if [ ! -f "$DISPATCH" ]; then
              echo "  ❌ dispatch.c not found at expected path"
              echo "     searching..."
              DISPATCH="$(grep -rl 'CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY' \
                            "${ROOT}/KernelSU/kernel/" 2>/dev/null \
                          | grep '\.c$' | head -1 || true)"
              if [ -z "$DISPATCH" ]; then
                echo "     ❌ not found anywhere — aborting port"
                echo "70_native:X:no-dispatcher" >> /tmp/fuzz_summary
                PORT_OK=0
              else
                echo "     ✅ relocated: $DISPATCH"
              fi
            else
              echo "  ✅ dispatcher: kernel/supercall/dispatch.c"
            fi

            # ── Precondition 2: command constant defined (from 51_) ──
            if [ "$PORT_OK" = "1" ]; then
              if grep -q 'define CMD_SUSFS_ADD_SUS_KSTAT_REDIRECT' \
                   "${ROOT}/include/linux/susfs_def.h" 2>/dev/null; then
                echo "  ✅ CMD_SUSFS_ADD_SUS_KSTAT_REDIRECT defined:"
                grep -n 'define CMD_SUSFS_ADD_SUS_KSTAT_REDIRECT' \
                  "${ROOT}/include/linux/susfs_def.h" | sed 's/^/       /'
              else
                echo "  ❌ command constant missing — 51_ did not apply?"
                echo "70_native:X:cmd-undefined" >> /tmp/fuzz_summary
                PORT_OK=0
              fi
            fi

            # ── Precondition 3: implementation function exists ──
            # Without this the insertion causes an implicit-declaration
            # error, or worse an undefined symbol at link time.
            if [ "$PORT_OK" = "1" ]; then
              if grep -rq 'susfs_add_sus_kstat_redirect' \
                   "${ROOT}/include/linux/susfs.h" "${ROOT}/fs/susfs.c" 2>/dev/null; then
                echo "  ✅ susfs_add_sus_kstat_redirect() present:"
                grep -rn 'susfs_add_sus_kstat_redirect' \
                  "${ROOT}/include/linux/susfs.h" "${ROOT}/fs/susfs.c" 2>/dev/null \
                  | head -4 | sed 's/^/       /'
              else
                echo "  ❌ susfs_add_sus_kstat_redirect() NOT found."
                echo "     Inserting the case would break the build."
                echo "70_native:X:impl-missing" >> /tmp/fuzz_summary
                PORT_OK=0
              fi
            fi

            # ── Precondition 4: Kconfig symbol declared (by 51_) ──
            if [ "$PORT_OK" = "1" ]; then
              if grep -rq 'KSU_SUSFS_SUS_KSTAT_REDIRECT' \
                   "${ROOT}/fs/Kconfig" "${ROOT}/drivers/kernelsu/Kconfig" 2>/dev/null; then
                echo "  ✅ CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT declared:"
                grep -rn 'KSU_SUSFS_SUS_KSTAT_REDIRECT' \
                  "${ROOT}/fs/Kconfig" "${ROOT}/drivers/kernelsu/Kconfig" 2>/dev/null \
                  | head -3 | sed 's/^/       /'
              else
                echo "  ⚠️  Kconfig symbol not declared — case will be"
                echo "     #ifdef'd out. Harmless, but inert."
              fi
            fi

            # ── Precondition 5: not already present ──
            if [ "$PORT_OK" = "1" ]; then
              if grep -q 'CMD_SUSFS_ADD_SUS_KSTAT_REDIRECT' "$DISPATCH"; then
                echo "  ℹ️  already handled in dispatcher — nothing to do"
                echo "70_native:0:already-present" >> /tmp/fuzz_summary
                echo "KSU_SAFETY_OK=1" >> $GITHUB_ENV
                PORT_OK=0
              fi
            fi

            # ── Precondition 6: anchor line exists, exactly once ──
            if [ "$PORT_OK" = "1" ]; then
              ANCHOR_N="$(grep -c '^#endif //#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT$' "$DISPATCH" || echo 0)"
              echo "  Anchor '#endif //#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT' found: ${ANCHOR_N}x"
              if [ "$ANCHOR_N" != "1" ]; then
                echo "  ❌ expected exactly 1 anchor — aborting"
                echo "70_native:X:bad-anchor" >> /tmp/fuzz_summary
                PORT_OK=0
              fi
            fi

            # ── Apply: insert in rc2's native switch-case form ──
            if [ "$PORT_OK" = "1" ]; then
              echo ""
              echo "  --- BEFORE ---"
              grep -n -B6 '^#endif //#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT$' "$DISPATCH" | sed 's/^/    /'

              cp "$DISPATCH" /tmp/dispatch.c.bak

              awk '
                /^#endif \/\/#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT$/ && !done {
                    print "#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT"
                    print "    case CMD_SUSFS_ADD_SUS_KSTAT_REDIRECT: {"
                    print "        susfs_add_sus_kstat_redirect(arg);"
                    print "        return 0;"
                    print "    }"
                    print "#endif"
                    done = 1
                }
                { print }
              ' /tmp/dispatch.c.bak > "$DISPATCH"

              echo ""
              echo "  --- AFTER ---"
              grep -n -B10 -A2 '^#endif //#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT$' "$DISPATCH" | sed 's/^/    /'

              # ── Verify ──
              echo ""
              echo "  --- VERIFICATION ---"
              VOK=1
              N="$(grep -c 'CMD_SUSFS_ADD_SUS_KSTAT_REDIRECT' "$DISPATCH" || echo 0)"
              [ "$N" = "1" ] && echo "    ✅ case inserted exactly once" \
                             || { echo "    ❌ inserted ${N}x (expected 1)"; VOK=0; }

              OB="$(grep -c '{' /tmp/dispatch.c.bak || echo 0)"
              CB="$(grep -c '}' /tmp/dispatch.c.bak || echo 0)"
              OA="$(grep -c '{' "$DISPATCH" || echo 0)"
              CA="$(grep -c '}' "$DISPATCH" || echo 0)"
              echo "    braces: before ${OB}/${CB}  after ${OA}/${CA}"
              [ "$(( OA - OB ))" = "1" ] && [ "$(( CA - CB ))" = "1" ] \
                && echo "    ✅ brace delta balanced (+1/+1)" \
                || { echo "    ❌ brace delta unbalanced"; VOK=0; }

              LB="$(wc -l < /tmp/dispatch.c.bak)"
              LA="$(wc -l < "$DISPATCH")"
              echo "    lines: ${LB} -> ${LA} (+$(( LA - LB )))"
              [ "$(( LA - LB ))" = "6" ] || { echo "    ❌ expected +6 lines"; VOK=0; }

              if [ "$VOK" = "1" ]; then
                echo ""
                echo "  ✅ NATIVE PORT SUCCESSFUL"
                echo "70_native:0:ported" >> /tmp/fuzz_summary
                echo "KSU_SAFETY_OK=1" >> $GITHUB_ENV
              else
                echo ""
                echo "  ❌ verification failed — REVERTING"
                cp /tmp/dispatch.c.bak "$DISPATCH"
                echo "70_native:X:verify-failed" >> /tmp/fuzz_summary
                echo "::warning::70_ native port reverted; build continues without it"
              fi
            fi

            # Note on hunk 1 (deliberately not ported)
            echo ""
            echo "  NOTE: hunk 1 (KSU_TP_HOOK guard) intentionally skipped."
            echo "        It only matters when CONFIG_KSU_SUSFS is DISABLED."
            echo "        We always enable it, so it is a no-op here."
          fi
          # ══ END NATIVE 70_ PORT ══════════════════════════════════
