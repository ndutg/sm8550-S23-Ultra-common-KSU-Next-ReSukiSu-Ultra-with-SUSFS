name: Test Yucca native ReSukiSU build

on:
  workflow_dispatch:
    inputs:
      yucca_ref:
        description: "Yucca kernel branch, tag, or commit"
        required: true
        default: "main"
        type: string
      mode:
        description: "Yucca build mode"
        required: true
        default: "resukisu"
        type: choice
        options:
          - resukisu
          - lkm

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Yucca native ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/share/boost /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          df -h /

      - name: Checkout Yucca kernel source
        uses: actions/checkout@v4
        with:
          repository: yucca-a/kernel_samsung_sm8550
          ref: ${{ inputs.yucca_ref }}
          fetch-depth: 1
          path: kernel

      - name: Checkout this repository for AnyKernel3
        uses: actions/checkout@v4
        with:
          path: packaging-source
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex \
            g++-multilib gcc-multilib git gnupg jq libelf-dev \
            liblz4-tool libssl-dev lz4 lzop pahole perl \
            python-is-python3 python3 rsync tar unzip zip zlib1g-dev

      - name: Create swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare AnyKernel3 tree
        shell: bash
        run: |
          set -euo pipefail
          AK_ARCHIVE="${GITHUB_WORKSPACE}/packaging-source/.github/goodies/AnyKernel3.zip"
          AK_DIR="${GITHUB_WORKSPACE}/kernel/anykernel3"

          test -s "$AK_ARCHIVE" || {
            echo "::error::AnyKernel3 archive not found: $AK_ARCHIVE"
            exit 1
          }

          rm -rf "$AK_DIR"
          mkdir -p "$AK_DIR"
          unzip -q "$AK_ARCHIVE" -d "$AK_DIR"

          # Flatten one wrapper directory when the archive contains one.
          if [ ! -f "$AK_DIR/anykernel.sh" ]; then
            WRAPPER="$(find "$AK_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            if [ -n "$WRAPPER" ] && [ -f "$WRAPPER/anykernel.sh" ]; then
              TMP="${GITHUB_WORKSPACE}/anykernel-flat"
              rm -rf "$TMP"
              mkdir -p "$TMP"
              cp -a "$WRAPPER/." "$TMP/"
              rm -rf "$AK_DIR"
              mv "$TMP" "$AK_DIR"
            fi
          fi

          test -s "$AK_DIR/anykernel.sh" || {
            echo "::error::anykernel.sh is missing after extraction"
            find "$AK_DIR" -maxdepth 3 -type f -print | sort
            exit 1
          }
          test -d "$AK_DIR/META-INF" || {
            echo "::error::META-INF is missing from AnyKernel3"
            exit 1
          }
          test -d "$AK_DIR/tools" || {
            echo "::error::tools is missing from AnyKernel3"
            exit 1
          }

          rm -rf "$AK_DIR/.git" "$AK_DIR/.github"
          echo "ANYKERNEL_DIR=$AK_DIR" >> "$GITHUB_ENV"
          echo "Prepared AnyKernel3: $AK_DIR"

      - name: Show Yucca build entrypoint
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          test -f scripts/build/build.sh || {
            echo "::error::Yucca build entrypoint is missing"
            find scripts -maxdepth 3 -type f -name '*.sh' -print | sort
            exit 1
          }
          bash -n scripts/build/build.sh
          echo "Yucca commit: $(git rev-parse HEAD)"
          echo "Yucca subject: $(git log -1 --format=%s)"
          echo "AnyKernel3: ${ANYKERNEL_DIR}"

      - name: Run Yucca native build
        id: yucca
        shell: bash
        working-directory: kernel
        env:
          BUILD_MODE: ${{ inputs.mode }}
          ANYKERNEL_DIR: ${{ env.ANYKERNEL_DIR }}
        run: |
          set -o pipefail
          chmod +x scripts/build/build.sh
          ./scripts/build/build.sh "$BUILD_MODE" 2>&1 | tee "${GITHUB_WORKSPACE}/yucca-native-build.log"

      - name: Report exact component versions
        if: always()
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail
          REPORT="${GITHUB_WORKSPACE}/yucca-component-report.txt"
          : > "$REPORT"

          {
            echo "YUCCA NATIVE BUILD REPORT"
            echo "========================="
            echo "Yucca commit: $(git rev-parse HEAD)"
            echo "Yucca subject: $(git log -1 --format=%s)"
            echo "Build mode: ${{ inputs.mode }}"
            echo ""
            echo "Detected build versions:"
            grep -E 'ReSukiSU version code:|ReSukiSU version name:|SUSFS_VERSION:' \
              "${GITHUB_WORKSPACE}/yucca-native-build.log" | tail -20 || true
            echo ""
            echo "Git repositories created during build:"
          } | tee -a "$REPORT"

          find . -maxdepth 5 -type d -name .git -print0 |
            while IFS= read -r -d '' gitdir; do
              repo="${gitdir%/.git}"
              {
                echo ""
                echo "Repository: $repo"
                echo "Remote: $(git -C "$repo" remote get-url origin 2>/dev/null || echo unknown)"
                echo "Branch: $(git -C "$repo" branch --show-current 2>/dev/null || true)"
                echo "Commit: $(git -C "$repo" rev-parse HEAD 2>/dev/null || echo unknown)"
                echo "Date: $(git -C "$repo" log -1 --format=%ci 2>/dev/null || echo unknown)"
              } | tee -a "$REPORT"
            done

          {
            echo ""
            echo "Generated outputs:"
            find . -maxdepth 8 -type f \
              \( -name '*.zip' -o -name 'Image' -o -name 'Image.gz' \
                 -o -name 'Image.gz-dtb' -o -name '*.rej' \) \
              -not -path './.git/*' -print | sort
          } | tee -a "$REPORT"

      - name: Collect and validate outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT_DIR="${GITHUB_WORKSPACE}/test-results"
          mkdir -p "$RESULT_DIR"
          cp -f yucca-native-build.log "$RESULT_DIR/" 2>/dev/null || true
          cp -f yucca-component-report.txt "$RESULT_DIR/" 2>/dev/null || true

          find kernel -maxdepth 8 -type f \
            \( -name '*.zip' -o -name 'Image' -o -name 'Image.gz' \
               -o -name 'Image.gz-dtb' -o -name '*.rej' \) \
            -not -path '*/.git/*' -print | sort | tee "$RESULT_DIR/output-files.txt"

          find kernel -maxdepth 8 -type f -name '*.zip' -exec cp -f {} "$RESULT_DIR/" \;
          find kernel/out -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' \) \
            -exec cp -f {} "$RESULT_DIR/" \; 2>/dev/null || true

          FLASHABLE_COUNT=0
          for zipfile in "$RESULT_DIR"/*.zip; do
            [ -f "$zipfile" ] || continue
            if unzip -Z1 "$zipfile" | grep -qx 'anykernel.sh' && \
               unzip -Z1 "$zipfile" | grep -q '^META-INF/' && \
               unzip -Z1 "$zipfile" | grep -q '^tools/' && \
               unzip -Z1 "$zipfile" | grep -Eq '^(Image|Image.gz|Image.gz-dtb)$'; then
              unzip -t "$zipfile"
              echo "Validated flashable ZIP: $zipfile"
              FLASHABLE_COUNT=$((FLASHABLE_COUNT + 1))
            fi
          done

          echo "Flashable ZIPs validated: $FLASHABLE_COUNT"
          ls -lah "$RESULT_DIR"

      - name: Upload Yucca native build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yucca-native-${{ inputs.mode }}-${{ github.run_number }}
          path: test-results/
          compression-level: 0
          if-no-files-found: error
