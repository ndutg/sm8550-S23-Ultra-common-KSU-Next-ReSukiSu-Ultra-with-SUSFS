name: Test ZeroMount Core Without Procfs or Metadata Hooks

on:
  workflow_dispatch:
    inputs:
      build_ksun:
        description: "Build KernelSU-Next (stable)"
        type: boolean
        default: false
      build_resukisu:
        description: "Build ReSukiSU (main)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  KERNEL_BRANCH: android13-5.15
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.15
  CLANG_VERSION: r584948
  SUPER_BUILDERS_REPO: https://github.com/Enginex0/Super-Builders.git
  SUPER_BUILDERS_COMMIT: c2cb71614868fe742cbffee2b6f3126523432673
  ZERO_MOUNT_PATCH: android13-5.15/ReSukiSU/patches/60_zeromount-android13-5.15.patch
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  setup:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      is_empty: ${{ steps.build-matrix.outputs.is_empty }}
    steps:
      - name: Build variant matrix from inputs
        id: build-matrix
        run: |
          VARIANTS='[]'

          # ── Scheduled runs: always build ReSukiSU only ──
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run — building ReSukiSU only."
            VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
              "variant": "resukisu",
              "display_name": "ReSukiSU (main)",
              "setup_url": "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh",
              "setup_arg": "main",
              "ksu_dir": "KernelSU",
              "artifact_prefix": "resukisu",
              "use_manual_hook": "true"
            }]')
          else
            # ── Manual dispatch: respect user selections ──
            if [ "${{ inputs.build_ksun }}" = "true" ]; then
              VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
                "variant": "ksun-stable",
                "display_name": "KernelSU-Next (stable)",
                "setup_url": "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh",
                "setup_arg": "main",
                "ksu_dir": "KernelSU-Next",
                "artifact_prefix": "ksun-stable",
                "use_manual_hook": "false"
              }]')
            fi
            if [ "${{ inputs.build_resukisu }}" = "true" ]; then
              VARIANTS=$(echo "$VARIANTS" | jq -c '. += [{
                "variant": "resukisu",
                "display_name": "ReSukiSU (main)",
                "setup_url": "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh",
                "setup_arg": "main",
                "ksu_dir": "KernelSU",
                "artifact_prefix": "resukisu",
                "use_manual_hook": "true"
              }]')
            fi
          fi

          COUNT=$(echo "$VARIANTS" | jq 'length')
          echo "Selected $COUNT variant(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "is_empty=true" >> $GITHUB_OUTPUT
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo "::warning::No variants selected."
          else
            echo "is_empty=false" >> $GITHUB_OUTPUT
            MATRIX=$(printf '{"include":%s}' "$VARIANTS" | jq -c .)
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

  prepare-clang:
    name: Cache Clang toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: Restore Clang from cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}

      - name: Download Clang (cache miss only)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading AOSP Clang ${{ env.CLANG_VERSION }}..."
          curl -sSfL --retry 3 --connect-timeout 30 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            || { echo "ERROR: Clang download failed."; exit 1; }
          mkdir -p clang-toolchain
          tar -xf clang.tar.gz -C clang-toolchain
          rm -f clang.tar.gz

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang binary not found."; exit 1; }

  build:
    name: ${{ matrix.display_name }}
    needs: [setup, prepare-clang]
    if: needs.setup.outputs.is_empty == 'false'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: a4eafcbbe8fe692708b57e7d248e773cd92496a7
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      - name: Restore Clang ${{ env.CLANG_VERSION }} from cache
        uses: actions/cache/restore@v4
        with:
          path: clang-toolchain
          key: clang-aosp-${{ env.CLANG_VERSION }}
          fail-on-cache-miss: true

      - name: Verify Clang
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          clang --version || { echo "ERROR: clang not found."; exit 1; }

      - name: Setup ${{ matrix.display_name }}
        id: ksu
        run: |
          echo "==> Setting up ${{ matrix.display_name }}..."
          curl -sSfL --retry 3 --connect-timeout 20 \
            "${{ matrix.setup_url }}" \
            | bash -s "${{ matrix.setup_arg }}" \
            || { echo "ERROR: setup.sh failed."; exit 1; }

          KSU_DIR="${{ matrix.ksu_dir }}"
          KSU_TAG=$(git -C "${KSU_DIR}" describe --tags --abbrev=0 2>/dev/null \
            || git -C "${KSU_DIR}" tag --list 'v[0-9]*' --sort=-v:refname \
            2>/dev/null | head -1 \
            || echo "main")

          HOOK_MODE="kprobes"
          if [ "${{ matrix.use_manual_hook }}" = "true" ]; then
            HOOK_MODE="manual-hook"
          fi

          BUILD_SUFFIX="${{ matrix.artifact_prefix }}-${KSU_TAG}-${HOOK_MODE}"

          echo "KSUDIR=${KSU_DIR}"           >> $GITHUB_ENV
          echo "BUILDSUFFIX=${BUILD_SUFFIX}" >> $GITHUB_ENV

      # ════════════════════════════════════════════════════════════
      # ── Restore previous build SHAs for delta changelog ──
      # ════════════════════════════════════════════════════════════
      - name: Restore previous build SHAs
        id: prev-build
        uses: actions/cache/restore@v4
        with:
          path: .prev_build_shas
          key: build-shas-${{ matrix.variant }}-
          restore-keys: |
            build-shas-${{ matrix.variant }}-

      # ════════════════════════════════════════════════════════════
      # ── Smart Build Changelog (delta-aware) ──
      # ════════════════════════════════════════════════════════════
      - name: Generate build changelog
        run: |
          echo "==> Generating smart build changelog..."
          CHANGELOG="CHANGELOG.txt"

          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          VARIANT="${{ matrix.display_name }}"
          KSUDIR_LOCAL="${{ matrix.ksu_dir }}"

          # ── Load previous build SHAs (safe parsing — no source) ──
          PREV_KERNEL_SHA=""
          PREV_KSU_SHA=""
          PREV_SUSFS_SHA=""
          PREV_DATE=""
          if [ -f ".prev_build_shas" ]; then
            PREV_KERNEL_SHA=$(grep '^PREV_KERNEL_SHA=' .prev_build_shas | cut -d= -f2- | tr -d "'")
            PREV_KSU_SHA=$(grep '^PREV_KSU_SHA=' .prev_build_shas | cut -d= -f2- | tr -d "'")
            PREV_SUSFS_SHA=$(grep '^PREV_SUSFS_SHA=' .prev_build_shas | cut -d= -f2- | tr -d "'")
            PREV_DATE=$(grep '^PREV_DATE=' .prev_build_shas | cut -d= -f2- | tr -d "'")
            echo "  Previous build found: ${PREV_DATE:-unknown}"
            echo "  Previous kernel SHA: ${PREV_KERNEL_SHA:-unknown}"
            echo "  Previous KSU SHA:    ${PREV_KSU_SHA:-unknown}"
            echo "  Previous SUSFS SHA:  ${PREV_SUSFS_SHA:-unknown}"
          else
            echo "  No previous build found — showing last 15 commits"
          fi

          # ── Kernel source info ──
          KERNEL_SHA=$(git rev-parse --short HEAD)
          KERNEL_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "${{ env.KERNEL_BRANCH }}")

          if [ -n "$PREV_KERNEL_SHA" ] && git cat-file -e "${PREV_KERNEL_SHA}^{commit}" 2>/dev/null; then
            KERNEL_LOG=$(git log --oneline --date=short --format="%ad|%h|%s" "${PREV_KERNEL_SHA}..HEAD")
            KERNEL_SINCE="since last build (${PREV_DATE})"
          else
            KERNEL_LOG=$(git log --oneline --date=short --format="%ad|%h|%s" -15)
            KERNEL_SINCE="last 15 commits"
          fi

          # ── KSU info ──
          KSU_TAG="unknown"
          KSU_SHA="unknown"
          KSU_LOG=""
          KSU_SINCE="last 15 commits"
          if [ -d "${KSUDIR_LOCAL}" ]; then
            KSU_TAG=$(git -C "${KSUDIR_LOCAL}" describe --tags --abbrev=0 2>/dev/null \
              || git -C "${KSUDIR_LOCAL}" tag --list 'v[0-9]*' --sort=-v:refname 2>/dev/null | head -1 \
              || echo "main")
            KSU_SHA=$(git -C "${KSUDIR_LOCAL}" rev-parse --short HEAD 2>/dev/null || echo "unknown")

            if [ -n "$PREV_KSU_SHA" ] && git -C "${KSUDIR_LOCAL}" cat-file -e "${PREV_KSU_SHA}^{commit}" 2>/dev/null; then
              KSU_LOG=$(git -C "${KSUDIR_LOCAL}" log --oneline --date=short --format="%ad|%h|%s" "${PREV_KSU_SHA}..HEAD" 2>/dev/null || echo "")
              KSU_SINCE="since last build (${PREV_DATE})"
            else
              KSU_LOG=$(git -C "${KSUDIR_LOCAL}" log --oneline --date=short --format="%ad|%h|%s" -15 2>/dev/null || echo "")
              KSU_SINCE="last 15 commits"
            fi
          fi

          # ── Categorise commits function ──
          categorise_commits() {
            local LOG="$1"
            local LABEL="$2"
            local COUNTS_FILE="$3"

            local SEC=0 FIX=0 FEAT=0 LTS=0 OTHER=0
            local SEC_LINES="" FIX_LINES="" FEAT_LINES="" LTS_LINES="" OTHER_LINES=""

            while IFS='|' read -r cdate chash cmsg; do
              [ -z "$cmsg" ] && continue
              cmsg_lower=$(echo "$cmsg" | tr '[:upper:]' '[:lower:]')

              if echo "$cmsg_lower" | grep -qE 'security|cve-|vuln|overflow|use-after-free|oob|uaf|exploit|selinux fix'; then
                SEC=$((SEC+1))
                SEC_LINES="${SEC_LINES}    $(printf '\U0001F512') ${cdate}  ${chash}  ${cmsg}\n"
              elif echo "$cmsg_lower" | grep -qE 'merge.*lts|merge.*5\.15\.|linux 5\.15\.|lts merge|upstream merge'; then
                LTS=$((LTS+1))
                LTS_LINES="${LTS_LINES}    $(printf '\U0001F504') ${cdate}  ${chash}  ${cmsg}\n"
              elif echo "$cmsg_lower" | grep -qE 'fix|bug|crash|panic|null ptr|deadlock|race|hang|oops|regression|revert|resolve|repair'; then
                FIX=$((FIX+1))
                FIX_LINES="${FIX_LINES}    $(printf '\U0001F41B') ${cdate}  ${chash}  ${cmsg}\n"
              elif echo "$cmsg_lower" | grep -qE 'feat|add|support|implement|introduce|enable|new|enhance|improv|optim'; then
                FEAT=$((FEAT+1))
                FEAT_LINES="${FEAT_LINES}    $(printf '\u2728') ${cdate}  ${chash}  ${cmsg}\n"
              else
                OTHER=$((OTHER+1))
                OTHER_LINES="${OTHER_LINES}    $(printf '\U0001F527') ${cdate}  ${chash}  ${cmsg}\n"
              fi
            done <<< "$LOG"

            echo "  ${LABEL}: ${SEC} security, ${FIX} bug fixes, ${FEAT} features, ${LTS} LTS merges, ${OTHER} other"
            [ -n "$SEC_LINES" ]   && printf "  -- Security --\n${SEC_LINES}"
            [ -n "$FIX_LINES" ]   && printf "  -- Bug Fixes --\n${FIX_LINES}"
            [ -n "$FEAT_LINES" ]  && printf "  -- Features --\n${FEAT_LINES}"
            [ -n "$LTS_LINES" ]   && printf "  -- LTS / Upstream Merges --\n${LTS_LINES}"
            [ -n "$OTHER_LINES" ] && printf "  -- Other --\n${OTHER_LINES}"

            echo "${SEC}:${FIX}:${FEAT}:${LTS}:${OTHER}" > "$COUNTS_FILE"
          }

          # ── Process kernel commits ──
          KERNEL_RESULT=$(categorise_commits "$KERNEL_LOG" "Kernel" /tmp/kcounts)
          read K_SEC K_FIX K_FEAT K_LTS K_OTHER <<< $(cat /tmp/kcounts | tr ':' ' ')

          # ── Process KSU commits ──
          KSU_RESULT=$(categorise_commits "$KSU_LOG" "$VARIANT" /tmp/ksucounts)
          read KSU_SEC KSU_FIX KSU_FEAT KSU_LTS KSU_OTHER <<< $(cat /tmp/ksucounts | tr ':' ' ')

          # ── Calculate flash priority ──
          TOTAL_SEC=$((K_SEC + KSU_SEC))
          TOTAL_FIX=$((K_FIX + KSU_FIX))
          TOTAL_FEAT=$((K_FEAT + KSU_FEAT))

          if [ "$TOTAL_SEC" -gt 0 ]; then
            PRIORITY="FLASH NOW — Security patches detected"
            PRIORITY_ICON="$(printf '\U0001F534')"
          elif [ "$TOTAL_FIX" -gt 2 ] || [ "${K_LTS:-0}" -gt 0 ]; then
            PRIORITY="RECOMMENDED — Bug fixes or LTS merge"
            PRIORITY_ICON="$(printf '\U0001F7E1')"
          elif [ "$TOTAL_FEAT" -gt 0 ] || [ "$TOTAL_FIX" -gt 0 ]; then
            PRIORITY="OPTIONAL — Minor improvements"
            PRIORITY_ICON="$(printf '\U0001F7E2')"
          else
            PRIORITY="SKIP — Maintenance only, no user-facing changes"
            PRIORITY_ICON="$(printf '\u26AA')"
          fi

          PRIORITY_FULL="${PRIORITY_ICON} ${PRIORITY}"

          # ── Write CHANGELOG.txt ──
          {
            echo "======================================================="
            echo "  SM8550 KERNEL BUILD — CHANGE SUMMARY"
            echo "======================================================="
            echo ""
            echo "  Build Date:     ${DATE}"
            echo "  Variant:        ${VARIANT}"
            echo "  Kernel:         ${KERNEL_BRANCH} @ ${KERNEL_SHA}"
            echo "  KSU:            ${KSU_TAG} @ ${KSU_SHA}"
            echo "  SUSFS:          ${{ env.SUSFS_BRANCH }} (see below)"
            if [ -n "$PREV_DATE" ]; then
              echo "  Previous Build: ${PREV_DATE}"
            fi
            echo ""
            echo "  +-------------------------------------------+"
            echo "  |  FLASH PRIORITY: ${PRIORITY_FULL}"
            echo "  +-------------------------------------------+"
            echo ""
            echo "-- KERNEL SOURCE (${KERNEL_SINCE}) -----------"
            echo "$KERNEL_RESULT"
            echo ""
            echo "-- ${VARIANT} (${KSU_SINCE}) --------------"
            echo "$KSU_RESULT"
            echo ""
            echo "-- SUSFS ---------------------------------------"
            echo "  (appended after SUSFS clone)"
          } > "$CHANGELOG"

          # ── GitHub Actions Job Summary ──
          {
            echo "## Build: ${VARIANT}"
            echo ""
            echo "| Component | Version | Commit |"
            echo "|---|---|---|"
            echo "| **Kernel** | \`${KERNEL_BRANCH}\` | \`${KERNEL_SHA}\` |"
            echo "| **${VARIANT}** | \`${KSU_TAG}\` | \`${KSU_SHA}\` |"
            echo "| **SUSFS** | \`${{ env.SUSFS_BRANCH }}\` | *(see below)* |"
            if [ -n "$PREV_DATE" ]; then
              echo ""
              echo "> Comparing against previous build: **${PREV_DATE}**"
            fi
            echo ""
            echo "### Flash Priority: ${PRIORITY_FULL}"
            echo ""
            echo "| Category | Kernel | KSU | Total |"
            echo "|---|---|---|---|"
            echo "| Security | ${K_SEC} | ${KSU_SEC} | ${TOTAL_SEC} |"
            echo "| Bug Fixes | ${K_FIX} | ${KSU_FIX} | ${TOTAL_FIX} |"
            echo "| Features | ${K_FEAT} | ${KSU_FEAT} | ${TOTAL_FEAT} |"
            echo "| LTS Merges | ${K_LTS:-0} | - | ${K_LTS:-0} |"
            echo ""
            echo "<details><summary>Kernel Commits (${KERNEL_SINCE})</summary>"
            echo ""
            echo '```'
            echo "$KERNEL_RESULT"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>${VARIANT} Commits (${KSU_SINCE})</summary>"
            echo ""
            echo '```'
            echo "$KSU_RESULT"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "CHANGELOG_PATH=${CHANGELOG}" >> $GITHUB_ENV
          echo "FLASH_PRIORITY=${PRIORITY_FULL}" >> $GITHUB_ENV

          # ── Export counts for Discord notification ──
          echo "TOTAL_SEC=${TOTAL_SEC}" >> $GITHUB_ENV
          echo "TOTAL_FIX=${TOTAL_FIX}" >> $GITHUB_ENV
          echo "TOTAL_FEAT=${TOTAL_FEAT}" >> $GITHUB_ENV
          echo "TOTAL_LTS=${K_LTS:-0}" >> $GITHUB_ENV

          echo "==> Changelog generated."

      - name: Dynamic Header Fixes
        run: |
          MAIN_MK="drivers/kernelsu/Makefile"
          if [ -f "${MAIN_MK}" ]; then
            if ! grep -q 'ccflags-y += -I$(srctree)/drivers/kernelsu' "${MAIN_MK}"; then
              printf '\nccflags-y += -I$(srctree)/drivers/kernelsu\n' >> "${MAIN_MK}"
            fi
          fi

          echo "==> Scanning for files missing ksu_cred declaration..."
          FILES=$(grep -rl 'ksu_cred' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern struct cred \*ksu_cred' "$file"; then
              { printf '#include <linux/cred.h>\nextern struct cred *ksu_cred;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing allow_shell declaration..."
          FILES=$(grep -rlE 'allow_shell|ksu_allow_shell' drivers/kernelsu/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -E -q 'extern.*allow_shell' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_allow_shell;\nextern bool allow_shell;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

          echo "==> Scanning for files missing ksu_late_loaded declaration..."
          FILES=$(grep -rl 'ksu_late_loaded' drivers/kernelsu/ fs/ kernel/ | grep '\.c$' || true)
          for file in $FILES; do
            if ! grep -q 'extern bool ksu_late_loaded' "$file"; then
              { printf '#include <linux/types.h>\nextern bool ksu_late_loaded;\n'; cat "$file"; } > "${file}.tmp"
              mv "${file}.tmp" "$file"
            fi
          done

      - name: Apply SUSFS patches
        run: |
          git clone --depth 1 \
            "${{ env.SUSFS_REPO }}" \
            -b "${{ env.SUSFS_BRANCH }}" \
            susfs4ksu \
            || { echo "ERROR: SUSFS clone failed."; exit 1; }

          cp susfs4ksu/kernel_patches/fs/susfs.c                fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h     include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/

          patch -p1 --forward \
            < "susfs4ksu/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch" \
            || { echo "ERROR: SUSFS kernel patch failed."; exit 1; }

          KSU_PATCH="susfs4ksu/kernel_patches/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            echo "==> Attempting KSU driver SUSFS integration patch..."
            if patch -p1 --forward --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
              patch -p1 --forward < "$KSU_PATCH" \
                || echo "WARNING: KSU driver patch apply failed (will inject Kconfig manually)."
              echo "==> KSU driver SUSFS patch applied successfully."
            else
              echo "==> KSU driver patch already applied or conflicts — injecting Kconfig entries manually."
            fi
          else
            echo "WARNING: $KSU_PATCH not found — will inject Kconfig entries manually."
          fi

          # ── Dynamic Kconfig injection ──
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          if [ -f "$KSU_KCONFIG" ]; then
            if ! grep -q 'KSU_SUSFS' "$KSU_KCONFIG"; then
              echo "==> SUSFS Kconfig entries missing — extracting from susfs headers..."

              printf '\nconfig KSU_SUSFS\n\tbool "Enable SUSFS for KernelSU"\n\tdepends on KSU\n\tdefault y\n\thelp\n\t  Patch for SUSFS on KernelSU\n' >> "$KSU_KCONFIG"

              SUSFS_OPTS=$(grep -hroE 'CONFIG_KSU_SUSFS_[A-Z_]+' susfs4ksu/kernel_patches/include/linux/susfs.h susfs4ksu/kernel_patches/fs/susfs.c 2>/dev/null | sort -u | sed 's/CONFIG_KSU_SUSFS_//')

              echo "==> Found SUSFS sub-options: $SUSFS_OPTS"
              for opt in $SUSFS_OPTS; do
                DESC=$(echo "$opt" | tr '_' ' ' | tr '[:upper:]' '[:lower:]')
                printf '\nconfig KSU_SUSFS_%s\n\tbool "Enable %s"\n\tdepends on KSU_SUSFS\n\tdefault y\n' "$opt" "$DESC" >> "$KSU_KCONFIG"
              done
              echo "==> SUSFS Kconfig entries injected dynamically."
            else
              echo "==> SUSFS Kconfig entries already present."
            fi
          else
            echo "ERROR: KernelSU Kconfig not found at $KSU_KCONFIG"
            exit 1
          fi

          # ── Append SUSFS changelog (delta-aware, safe parsing) ──
          SUSFS_SHA=$(git -C susfs4ksu rev-parse --short HEAD 2>/dev/null || echo "unknown")
          SUSFS_LOG=""
          SUSFS_SINCE="last 15 commits"

          # Load previous SUSFS SHA safely
          PREV_SUSFS_SHA=""
          if [ -f ".prev_build_shas" ]; then
            PREV_SUSFS_SHA=$(grep '^PREV_SUSFS_SHA=' .prev_build_shas | cut -d= -f2- | tr -d "'")
          fi

          if [ -n "$PREV_SUSFS_SHA" ] && git -C susfs4ksu cat-file -e "${PREV_SUSFS_SHA}^{commit}" 2>/dev/null; then
            SUSFS_LOG=$(git -C susfs4ksu log --oneline --date=short --format="%ad|%h|%s" "${PREV_SUSFS_SHA}..HEAD" 2>/dev/null || echo "")
            SUSFS_SINCE="since last build"
          else
            SUSFS_LOG=$(git -C susfs4ksu log --oneline --date=short --format="%ad|%h|%s" -15 2>/dev/null || echo "")
          fi

          if [ -f "$CHANGELOG_PATH" ]; then
            {
              echo ""
              echo "-- SUSFS (${SUSFS_SINCE}) ---------------------"
              echo "  Branch: ${{ env.SUSFS_BRANCH }} @ ${SUSFS_SHA}"
              while IFS='|' read -r cdate chash cmsg; do
                [ -z "$cmsg" ] && continue
                cmsg_lower=$(echo "$cmsg" | tr '[:upper:]' '[:lower:]')
                if echo "$cmsg_lower" | grep -qE 'security|cve-|vuln'; then
                  printf '    \U0001F512 %s  %s  %s\n' "$cdate" "$chash" "$cmsg"
                elif echo "$cmsg_lower" | grep -qE 'fix|bug|crash'; then
                  printf '    \U0001F41B %s  %s  %s\n' "$cdate" "$chash" "$cmsg"
                elif echo "$cmsg_lower" | grep -qE 'feat|add|support|new|enhance'; then
                  printf '    \u2728 %s  %s  %s\n' "$cdate" "$chash" "$cmsg"
                else
                  printf '    \U0001F527 %s  %s  %s\n' "$cdate" "$chash" "$cmsg"
                fi
              done <<< "$SUSFS_LOG"
            } >> "$CHANGELOG_PATH"

            # Update job summary
            {
              echo ""
              echo "<details><summary>SUSFS Commits (${SUSFS_SINCE}) — \`${SUSFS_SHA}\`</summary>"
              echo ""
              echo '```'
              echo "Branch: ${{ env.SUSFS_BRANCH }} @ ${SUSFS_SHA}"
              while IFS='|' read -r cdate chash cmsg; do
                [ -z "$cmsg" ] && continue
                echo "  ${cdate}  ${chash}  ${cmsg}"
              done <<< "$SUSFS_LOG"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "==> SUSFS changelog appended."
          fi

          # Save current SUSFS SHA for next build
          echo "CURRENT_SUSFS_SHA=${SUSFS_SHA}" >> $GITHUB_ENV

          rm -rf susfs4ksu

      - name: Apply ZeroMount using Yucca integration method
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "  YUCCA-STYLE ZEROMOUNT INTEGRATION"
          echo "=================================================="
          echo "Keeping the existing ReSukiSU, SUSFS, and AnyKernel3 pipeline."
          echo "Using Super-Builders only for the pinned 60_ ZeroMount patch."

          git clone --quiet "${SUPER_BUILDERS_REPO}" super-builders
          git -C super-builders checkout --quiet "${SUPER_BUILDERS_COMMIT}"

          PATCH_FILE="super-builders/${ZERO_MOUNT_PATCH}"
          PATCH_LOG="/tmp/zeromount.patch.log"
          C89_PATCH="/tmp/zeromount-stat-c89.patch"

          test -s "$PATCH_FILE" || {
            echo "::error::ZeroMount patch missing: $PATCH_FILE"
            exit 1
          }

          echo "Super-Builders SHA: $(git -C super-builders rev-parse HEAD)"
          echo "ZeroMount patch: $PATCH_FILE"

          zeromount_core_present() {
            [ -s fs/zeromount.c ] &&
            [ -s include/linux/zeromount.h ] &&
            grep -q 'config ZEROMOUNT' fs/Kconfig &&
            grep -q 'CONFIG_ZEROMOUNT' fs/Makefile &&
            grep -q 'zeromount_getname_hook' fs/namei.c &&
            grep -q 'zeromount_inject_dents' fs/readdir.c
          }

          find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete
          rm -f "$PATCH_LOG"

          # ── AUDIO ISOLATION TEST: core ZeroMount only ──
          # Preserve the post-SUSFS versions of procfs and metadata files,
          # then restore them after the main ZeroMount patch. This leaves
          # the core path-redirection and directory-injection hooks active.
          cp fs/proc/task_mmu.c /tmp/task_mmu.pre-zeromount.c
          cp fs/proc/base.c /tmp/proc_base.pre-zeromount.c
          cp fs/stat.c /tmp/stat.pre-zeromount.c
          cp fs/statfs.c /tmp/statfs.pre-zeromount.c
          cp fs/xattr.c /tmp/xattr.pre-zeromount.c

          # Match Yucca's logic exactly:
          # 1. Detect an already-applied patch with a reverse dry run at F3.
          # 2. Otherwise apply with GNU patch, -F3, quiet output, and no backups.
          if zeromount_core_present; then
            echo "==> ZeroMount core is already present."
          elif /usr/bin/patch -p1 -R --dry-run -F3 -s -f \
                 --no-backup-if-mismatch < "$PATCH_FILE" >/dev/null 2>&1; then
            echo "==> ZeroMount patch is already applied."
          else
            set +e
            /usr/bin/patch -p1 -F3 --no-backup-if-mismatch \
              < "$PATCH_FILE" 2>&1 | tee "$PATCH_LOG"
            PATCH_RC=${PIPESTATUS[0]}
            set -e

            if [ "$PATCH_RC" -ne 0 ]; then
              echo "::error::Yucca-style ZeroMount patch application failed."
              find . -type f -name '*.rej' -print -exec sed -n '1,100p' {} \;
              exit 1
            fi
          fi

          echo "==> AUDIO ISOLATION TEST: reverting ZeroMount procfs and metadata changes..."
          cp /tmp/task_mmu.pre-zeromount.c fs/proc/task_mmu.c
          cp /tmp/proc_base.pre-zeromount.c fs/proc/base.c
          cp /tmp/stat.pre-zeromount.c fs/stat.c
          cp /tmp/statfs.pre-zeromount.c fs/statfs.c
          cp /tmp/xattr.pre-zeromount.c fs/xattr.c

          for ISOLATED_FILE in             fs/proc/task_mmu.c             fs/proc/base.c             fs/stat.c             fs/statfs.c             fs/xattr.c; do
            if grep -qiE 'zeromount' "$ISOLATED_FILE"; then
              echo "::error::ZeroMount references remain in $ISOLATED_FILE after revert."
              grep -niE 'zeromount' "$ISOLATED_FILE"
              exit 1
            fi
          done

          echo "==> fs/proc/task_mmu.c restored to SUSFS-only state."
          echo "==> fs/proc/base.c restored to SUSFS-only state."
          echo "==> fs/stat.c restored to its pre-ZeroMount state."
          echo "==> fs/statfs.c restored to its pre-ZeroMount state."
          echo "==> fs/xattr.c restored to its pre-ZeroMount state."
          echo "==> Yucca fs/stat.c C89 fix is intentionally unnecessary because fs/stat.c was restored."

          # Reject unresolved patch output after both Yucca fixups.
          REJECTS="$(find . -type f -name '*.rej' -print)"
          if [ -n "$REJECTS" ]; then
            echo "::error::ZeroMount reject files remain after Yucca fixups:"
            printf '%s\n' "$REJECTS"
            exit 1
          fi

          # Core and placement checks from Yucca's integration.
          zeromount_core_present || {
            echo "::error::ZeroMount core verification failed."
            exit 1
          }

          ISOLATED_HOOKS=0
          for ISOLATED_FILE in             fs/proc/task_mmu.c             fs/proc/base.c             fs/stat.c             fs/statfs.c             fs/xattr.c; do
            COUNT="$(grep -ciE 'zeromount' "$ISOLATED_FILE" || true)"
            echo "==> $ISOLATED_FILE ZeroMount references: $COUNT"
            if [ "$COUNT" != "0" ]; then
              ISOLATED_HOOKS=1
            fi
          done
          [ "$ISOLATED_HOOKS" = "0" ] || {
            echo "::error::One or more isolated procfs/metadata hooks remain."
            exit 1
          }
          echo "==> Confirmed: ZeroMount procfs and metadata hooks are excluded."

          MAX_FUZZ=0
          if [ -s "$PATCH_LOG" ]; then
            for level in 1 2 3; do
              if grep -q "with fuzz ${level}" "$PATCH_LOG"; then
                MAX_FUZZ=$level
              fi
            done
          fi

          echo "ZEROMOUNT_ENABLED=1" >> "$GITHUB_ENV"
          echo "ZEROMOUNT_MAX_FUZZ=${MAX_FUZZ}" >> "$GITHUB_ENV"
          echo "==> ZeroMount core-only integration passed; procfs and metadata hooks are EXCLUDED."
          echo "==> Main patch maximum fuzz: ${MAX_FUZZ}; isolated files restored and verified."

          find . -type f \( -name '*.rej' -o -name '*.orig' \) -delete
          rm -rf super-builders

      - name: Verify pinned baseline and ZeroMount-only test scope
        run: |
          set -euo pipefail
          EXPECTED_KERNEL_SHA="a4eafcbbe8fe692708b57e7d248e773cd92496a7"
          ACTUAL_KERNEL_SHA="$(git rev-parse HEAD)"
          echo "Expected working kernel SHA: $EXPECTED_KERNEL_SHA"
          echo "Actual checked-out SHA:      $ACTUAL_KERNEL_SHA"
          [ "$ACTUAL_KERNEL_SHA" = "$EXPECTED_KERNEL_SHA" ] || {
            echo "::error::Kernel source does not match the known-good sound build."
            exit 1
          }

          echo "==> Confirming required ZeroMount files and corrected hooks..."
          test -s fs/zeromount.c
          test -s include/linux/zeromount.h
          grep -q 'config ZEROMOUNT' fs/Kconfig
          grep -q 'CONFIG_ZEROMOUNT' fs/Makefile
          grep -q 'zeromount_getname_hook' fs/namei.c
          grep -q 'zeromount_inject_dents' fs/readdir.c
          for ISOLATED_FILE in             fs/proc/task_mmu.c             fs/proc/base.c             fs/stat.c             fs/statfs.c             fs/xattr.c; do
            [ "$(grep -ciE 'zeromount' "$ISOLATED_FILE" || true)" = "0" ] || {
              echo "::error::Unexpected ZeroMount reference remains in $ISOLATED_FILE"
              exit 1
            }
          done

          echo "==> Baseline pin and ZeroMount integration checks passed."
          echo "==> Existing ReSukiSU and SUSFS source changes are intentionally retained from the known-good workflow."

      - name: Resolve kernel version and date
        id: meta
        run: |
          KVER=$(make kernelversion 2>/dev/null | awk -F. '{print $1"."$2"."$3}')
          echo "kernelversion=${KVER}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)"  >> $GITHUB_OUTPUT

      - name: Set up swap (24 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Generate defconfig
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      - name: Dynamically enable SUSFS configs
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"

          # Always enable KSU base
          ./scripts/config --file out/.config -e CONFIG_KSU

          # Dynamically enable ALL KSU_SUSFS options found in Kconfig
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          echo "==> Dynamically enabling all SUSFS config options..."
          grep -oE '^config KSU_SUSFS[A-Z_]*' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            echo "  Enabling $OPT"
            ./scripts/config --file out/.config -e "$OPT"
          done

          if [ "${ZEROMOUNT_ENABLED:-0}" = "1" ]; then
            echo "==> Enabling CONFIG_ZEROMOUNT only; all other defconfig values remain unchanged..."
            ./scripts/config --file out/.config -e CONFIG_ZEROMOUNT
          fi

          # Enable manual hook if this variant uses it
          if [ "${{ matrix.use_manual_hook }}" = "true" ]; then
            echo "==> Enabling manual hook mode..."
            ./scripts/config --file out/.config -e CONFIG_KSU_MANUAL_HOOK
          fi

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Verify kernel config (dynamic)
        run: |
          echo "==> Verifying kernel config options..."
          CONFIG="out/.config"
          KSU_KCONFIG="drivers/kernelsu/Kconfig"
          FAILED=0

          if grep -q 'CONFIG_KSU=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU=y"
          else
            echo "  ❌ CONFIG_KSU=y is MISSING!"
            FAILED=1
          fi

          if grep -q 'CONFIG_KSU_SUSFS=y' "$CONFIG"; then
            echo "  ✅ CONFIG_KSU_SUSFS=y"
          else
            echo "  ❌ CONFIG_KSU_SUSFS=y is MISSING!"
            FAILED=1
          fi

          if [ "${ZEROMOUNT_ENABLED:-0}" = "1" ]; then
            if grep -q '^CONFIG_ZEROMOUNT=y$' "$CONFIG"; then
              echo "  ✅ CONFIG_ZEROMOUNT=y"
            else
              echo "  ❌ CONFIG_ZEROMOUNT=y is MISSING!"
              FAILED=1
            fi
          fi
          echo "  --- SUSFS sub-options ---"
          grep -oE '^config KSU_SUSFS_[A-Z_]+' "$KSU_KCONFIG" | while read -r line; do
            OPT="CONFIG_${line#config }"
            if grep -q "${OPT}=y" "$CONFIG"; then
              echo "  ✅ ${OPT}=y"
            else
              echo "  ⚠️  ${OPT}=y not set (may have been dropped by olddefconfig)"
            fi
          done

          if [ "${{ matrix.use_manual_hook }}" = "true" ]; then
            echo "  --- Hook mode ---"
            if grep -q 'CONFIG_KSU_MANUAL_HOOK=y' "$CONFIG"; then
              echo "  ✅ CONFIG_KSU_MANUAL_HOOK=y (inline hook mode)"
            else
              echo "  ℹ️  CONFIG_KSU_MANUAL_HOOK not in .config (driver may handle hooks internally)"
            fi
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more CRITICAL config options are MISSING!"
            echo "==> Dumping KSU config for debugging:"
            grep -E 'CONFIG_KSU' "$CONFIG" || echo "(none found)"
            exit 1
          fi

          echo ""
          echo "==> Config verification complete."

      - name: Patch Header Refactors
        run: |
          echo "==> Applying fixes for missing KSU identifiers..."
          sed -i '/#include <linux\/cred.h>/a \
          extern struct cred *ksu_cred;\
          extern bool allow_shell;\
          extern bool ksu_late_loaded;' include/linux/cred.h

          sed -i '/#include <linux\/types.h>/a \
          extern bool ksu_late_loaded;' include/linux/sched.h
          echo "==> Headers patched successfully."

      # ════════════════════════════════════════════════════════════
      # ── KSU hook bridge stubs ──
      #   Static keys conditionally included via shell check on
      #   matrix.use_manual_hook at workflow runtime.
      #   KSU-Next needs them, ReSukiSU defines them internally.
      # ════════════════════════════════════════════════════════════
      - name: Create KSU hook bridge stubs
        run: |
          echo "==> Creating bridge stubs for pre-baked KSU hooks..."

          # Static keys only for KSU-Next — ReSukiSU defines them internally
          STATIC_KEY_LINES=""
          if [ "${{ matrix.use_manual_hook }}" != "true" ]; then
            STATIC_KEY_LINES=$(printf '%s\n' \
              'DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);' \
              'DEFINE_STATIC_KEY_FALSE(ksu_is_input_hook_enabled);')
            echo "  Including static key stubs (KSU-Next variant)"
          else
            echo "  Skipping static key stubs (ReSukiSU defines them internally)"
          fi

          {
            echo '#include <linux/types.h>'
            echo '#include <linux/fs.h>'
            echo '#include <linux/version.h>'
            echo '#include <linux/jump_label.h>'
            [ -n "$STATIC_KEY_LINES" ] && echo "$STATIC_KEY_LINES"
            echo 'int __attribute__((weak)) ksu_handle_sys_reboot(void) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_sys_read(unsigned int fd, char __user *buf, size_t count) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_vfs_fstat(int fd, struct kstat *stat) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_devpts(struct inode *inode) { return 0; }'
            echo 'int __attribute__((weak)) ksu_input_hook(void *dev, unsigned int type, unsigned int code, int value) { return 0; }'
            echo 'int __attribute__((weak)) ksu_execveat_hook(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags) { return 0; }'
            echo 'int __attribute__((weak)) ksu_handle_execveat_sucompat(int *fd, const char __user **filename_user, void *argv, void *envp, int *flags) { return 0; }'
            echo 'int __attribute__((weak)) ksu_init_rc_hook(const char *data, unsigned long count) { return 0; }'
            echo 'int __attribute__((weak)) ksu_install_su_fd(void) { return 0; }'
            echo 'bool __attribute__((weak)) susfs_is_current_ksu_domain(void) { return true; }'
            echo 'unsigned int __attribute__((weak)) susfs_ksu_sid;'
            echo 'unsigned int __attribute__((weak)) susfs_priv_app_sid;'
          } > kernel/ksu_hooks_bridge.c

          if ! grep -q 'ksu_hooks_bridge' kernel/Makefile; then
            echo 'obj-y += ksu_hooks_bridge.o' >> kernel/Makefile
          fi
          echo "==> Bridge stubs created."
          grep 'ksu_hooks_bridge' kernel/Makefile || echo "WARNING: Entry not found!"


      # ════════════════════════════════════════════════════════════
      # ── SELinux bridge stubs ──
      #   Upstream kernel source references ksu_selinux_hide_running
      #   and fake_state in security/selinux/ — provide weak
      #   definitions so the linker resolves them safely.
      # ════════════════════════════════════════════════════════════
      # - name: Create SELinux bridge stubs
      #   run: |
      #     echo "==> Creating SELinux bridge stubs..."

      #     {
      #       echo '#include "include/security.h"'
      #       echo '#include <linux/jump_label.h>'
      #       echo ''
      #       echo 'DEFINE_STATIC_KEY_FALSE(fake_status_initialize_key);'
      #       echo 'bool __attribute__((weak)) ksu_selinux_hide_enabled(void) { return false; }'
      #       echo 'struct selinux_state __attribute__((weak)) fake_status;'
      #       echo 'void __attribute__((weak)) initialize_fake_status(void) { }'
      #     } > security/selinux/ksu_selinux_bridge.c

      #     if ! grep -q 'ksu_selinux_bridge' security/selinux/Makefile; then
      #       echo 'obj-y += ksu_selinux_bridge.o' >> security/selinux/Makefile
      #     fi
      #     echo "==> SELinux bridge stubs created."
      #     grep 'ksu_selinux_bridge' security/selinux/Makefile || echo "WARNING: Entry not found!"


      - name: Build kernel (${{ matrix.display_name }})
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang-toolchain/bin:${PATH}"
          echo "==> Compiling: ${{ matrix.display_name }} [${BUILDSUFFIX}]..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

      - name: Verify SUSFS and ZeroMount objects were compiled
        run: |
          echo "==> Post-build verification..."
          FAILED=0

          if find out/ -name "susfs.o" | grep -q .; then
            echo "  ✅ fs/susfs.o found — SUSFS was compiled."
          else
            echo "  ❌ fs/susfs.o NOT found — SUSFS was NOT compiled!"
            FAILED=1
          fi

          if [ "${ZEROMOUNT_ENABLED:-0}" = "1" ]; then
            if find out/ -name "zeromount.o" | grep -q .; then
              echo "  ✅ fs/zeromount.o found — ZeroMount was compiled."
            else
              echo "  ❌ fs/zeromount.o NOT found — ZeroMount was NOT compiled!"
              FAILED=1
            fi
          fi

          if [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ]; then
            echo "  ✅ Kernel image found."
          else
            echo "  ❌ Kernel image NOT found!"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Post-build verification FAILED!"
            exit 1
          fi
          echo "==> All post-build checks passed."

      - name: Package AnyKernel3 ZIP
        run: |
          cp .github/goodies/AnyKernel3.zip .
          unzip AnyKernel3.zip -d AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "ERROR: No kernel Image found"
            exit 1
          fi

          # Include changelog in the flashable ZIP
          if [ -f "$CHANGELOG_PATH" ]; then
            cp "$CHANGELOG_PATH" AnyKernel3/
            echo "==> CHANGELOG.txt included in AnyKernel3 package."
          fi

      # ════════════════════════════════════════════════════════════
      # ── Print changelog to build log ──
      # ════════════════════════════════════════════════════════════
      - name: Print build changelog
        run: |
          echo ""
          echo "========================================================"
          echo "              BUILD CHANGELOG SUMMARY"
          echo "========================================================"
          echo ""
          if [ -f "$CHANGELOG_PATH" ]; then
            cat "$CHANGELOG_PATH"
          else
            echo "  (No changelog generated)"
          fi
          echo ""
          echo "========================================================"
          echo "  VERDICT: ${FLASH_PRIORITY}"
          echo ""
          echo "  Artifact: sm8550-${{ steps.meta.outputs.kernelversion }}-${BUILDSUFFIX}-susfs-zeromount-core-only-${{ steps.meta.outputs.date }}"
          echo "========================================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm8550-${{ steps.meta.outputs.kernelversion }}-${{ env.BUILDSUFFIX }}-susfs-zeromount-core-only-${{ steps.meta.outputs.date }}
          path: AnyKernel3
          compression-level: 9
          if-no-files-found: warn
          overwrite: false

      # ════════════════════════════════════════════════════════════
      # ── Discord notification (critical / recommended only) ──
      #   Only fires when flash priority is FLASH NOW or
      #   RECOMMENDED. Silently skips if webhook isn't configured.
      # ════════════════════════════════════════════════════════════
      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "==> Discord webhook not configured — skipping notification."
            exit 0
          fi

          echo "==> Sending Discord notification..."

          # Determine embed colour and label for all priorities
          if [ "${{ job.status }}" = "failure" ]; then
            EMBED_COLOR=15548997    # Red (#ED4245)
            PRIORITY_LABEL="❌ BUILD FAILED — Check logs immediately"
          elif echo "$FLASH_PRIORITY" | grep -q "FLASH NOW"; then
            EMBED_COLOR=15548997
            PRIORITY_LABEL="🔴 FLASH NOW — Security patches detected"
          elif echo "$FLASH_PRIORITY" | grep -q "RECOMMENDED"; then
            EMBED_COLOR=16776960
            PRIORITY_LABEL="🟡 RECOMMENDED — Bug fixes or LTS merge"
          elif echo "$FLASH_PRIORITY" | grep -q "OPTIONAL"; then
            EMBED_COLOR=5763719
            PRIORITY_LABEL="🟢 OPTIONAL — Minor improvements"
          else
            EMBED_COLOR=9807270
            PRIORITY_LABEL="⚪ SKIP — Maintenance only, no user-facing changes"
          fi

          VARIANT="${{ matrix.display_name }}"
          ARTIFACT="sm8550-${{ steps.meta.outputs.kernelversion }}-${BUILDSUFFIX}-susfs-zeromount-core-only-${{ steps.meta.outputs.date }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build the JSON payload
          PAYLOAD=$(jq -n \
            --arg title "🔔 SM8550 Kernel Build — ${VARIANT}" \
            --arg desc "Automated build status notification." \
            --arg priority "$PRIORITY_LABEL" \
            --arg sec "🔒 Security: ${TOTAL_SEC}" \
            --arg fix "🐛 Bug Fixes: ${TOTAL_FIX}" \
            --arg feat "✨ Features: ${TOTAL_FEAT}" \
            --arg lts "🔄 LTS Merges: ${TOTAL_LTS}" \
            --arg artifact "$ARTIFACT" \
            --arg url "$RUN_URL" \
            --argjson color "$EMBED_COLOR" \
            '{
              "embeds": [{
                "title": $title,
                "description": $desc,
                "color": $color,
                "fields": [
                  { "name": "Flash Priority", "value": $priority, "inline": false },
                  { "name": "Security",       "value": $sec,      "inline": true  },
                  { "name": "Bug Fixes",      "value": $fix,      "inline": true  },
                  { "name": "Features",       "value": $feat,     "inline": true  },
                  { "name": "LTS Merges",     "value": $lts,      "inline": true  },
                  { "name": "Artifact",       "value": $artifact, "inline": false },
                  { "name": "Build Log",      "value": ("[View on GitHub](" + $url + ")"), "inline": false }
                ],
                "footer": { "text": "SM8550 Kernel CI • Automated Build" },
                "timestamp": (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          curl -sSf -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" \
            && echo "==> Discord notification sent." \
            || echo "WARNING: Discord notification failed (non-fatal)."

      # ════════════════════════════════════════════════════════════
      # ── Save build SHAs for next run's delta changelog ──
      #   Only saved on successful build so a failed build
      #   doesn't corrupt the baseline.
      # ════════════════════════════════════════════════════════════
      - name: Save build SHAs for next run
        if: success()
        run: |
          {
            echo "PREV_KERNEL_SHA='$(git rev-parse HEAD)'"
            echo "PREV_KSU_SHA='$(git -C "$KSUDIR" rev-parse HEAD 2>/dev/null || echo '')'"
            echo "PREV_SUSFS_SHA='${CURRENT_SUSFS_SHA:-}'"
            echo "PREV_DATE='$(date '+%Y-%m-%d %H:%M UTC')'"
          } > .prev_build_shas
          echo "==> Build SHAs saved for next run:"
          cat .prev_build_shas

      - name: Cache build SHAs
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .prev_build_shas
          key: build-shas-${{ matrix.variant }}-${{ github.run_id }}
