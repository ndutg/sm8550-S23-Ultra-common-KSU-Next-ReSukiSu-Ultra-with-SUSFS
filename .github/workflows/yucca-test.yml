name: Test — yucca-a SM8550

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options:
          - resukisu
          - lkm
        default: resukisu
      pack_zip:
        description: "Pack AnyKernel3 zip (needs AnyKernel3 source)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Silences ~29,000 macOS xattr warnings from the toolchain tarball.
  TAR_OPTIONS: "--warning=no-unknown-keyword"

jobs:
  build:
    name: yucca-a ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:

      - name: Free up disk space
        run: |
          echo "==> Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/share/boost /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "==> Disk after cleanup:"
          df -h /

      - name: Checkout yucca-a kernel tree
        uses: actions/checkout@v4
        with:
          repository: yucca-a/kernel_samsung_sm8550
          ref: main
          fetch-depth: 1

      # ════════════════════════════════════════════════════════════
      # yucca-a does NOT ship an anykernel3/ tree. Pull the known-good
      # AnyKernel3.zip from your own repo and stage it so the build
      # script's pack step can find it.
      # ════════════════════════════════════════════════════════════
      - name: Checkout own repo (for AnyKernel3)
        if: inputs.pack_zip
        uses: actions/checkout@v4
        with:
          repository: ndutg/sm8550-S23-Ultra-common-KSU-Next-ReSukiSu-Ultra-with-SUSFS
          ref: android13-5.15
          fetch-depth: 1
          path: .own-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage AnyKernel3 tree
        if: inputs.pack_zip
        run: |
          AK_ZIP=".own-repo/.github/goodies/AnyKernel3.zip"
          if [ -f "$AK_ZIP" ]; then
            echo "==> Found $AK_ZIP — extracting to ./anykernel3"
            mkdir -p anykernel3
            unzip -q "$AK_ZIP" -d anykernel3
            echo "ANYKERNEL_DIR=${GITHUB_WORKSPACE}/anykernel3" >> $GITHUB_ENV
            ls -la anykernel3/
          else
            echo "::warning::AnyKernel3.zip not found — will build Image only."
            echo "ZIP_AFTER=0" >> $GITHUB_ENV
          fi

      - name: Skip zip packing
        if: ${{ !inputs.pack_zip }}
        run: echo "ZIP_AFTER=0" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git gnupg \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip unzip \
            python3 python-is-python3 tar perl lz4 jq \
            ccache rsync

      - name: Set up swap (8 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Show environment
        run: |
          echo "==> Kernel version:"
          make kernelversion 2>/dev/null || head -5 Makefile
          echo ""
          echo "==> Build mode marker: $(cat .kernel_build_mode 2>/dev/null || echo none)"
          echo "==> ANYKERNEL_DIR: ${ANYKERNEL_DIR:-<unset>}"
          echo "==> ZIP_AFTER: ${ZIP_AFTER:-<unset>}"
          echo ""
          nproc && free -h && df -h /

      - name: Build kernel (${{ inputs.mode }})
        run: |
          set -o pipefail
          chmod +x scripts/build/*.sh
          ./scripts/build/build.sh "${{ inputs.mode }}"

      - name: List build output
        if: always()
        run: |
          echo "==> Artifacts:"
          find out/ -maxdepth 4 -type f \
            \( -name "*.zip" -o -name "Image" -o -name "Image.gz" \) 2>/dev/null \
            || echo "(none)"
          echo ""
          echo "==> Disk after build:"
          df -h /

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yucca-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            out/${{ inputs.mode }}/**/*.zip
            out/${{ inputs.mode }}/arch/arm64/boot/Image
            out/${{ inputs.mode }}/arch/arm64/boot/Image.gz
          compression-level: 9
          if-no-files-found: warn
