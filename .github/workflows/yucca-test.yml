name: Test — yucca-a SM8550

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        options:
          - resukisu
          - lkm
        default: resukisu
      jobs:
        description: "Parallel make jobs (blank = nproc)"
        type: string
        default: ""

permissions:
  contents: read

env:
  # GNU tar reads this — silences the thousands of macOS xattr warnings
  # ('LIBARCHIVE.xattr.com.apple.quarantine') that flooded previous runs.
  TAR_OPTIONS: "--warning=no-unknown-keyword"

jobs:
  build:
    name: yucca-a ${{ inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:

      # ════════════════════════════════════════════════════════════
      # Free disk BEFORE checkout — the toolchain is ~2.2 GB
      # compressed and expands to roughly 8-10 GB.
      # ════════════════════════════════════════════════════════════
      - name: Free up disk space
        run: |
          echo "==> Disk before cleanup:"
          df -h /
          echo ""
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY}" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo ""
          echo "==> Disk after cleanup:"
          df -h /

      - name: Checkout yucca-a kernel tree
        uses: actions/checkout@v4
        with:
          repository: yucca-a/kernel_samsung_sm8550
          ref: main
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git gnupg \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip unzip \
            python3 python-is-python3 tar perl lz4 jq \
            ccache rsync

      # ════════════════════════════════════════════════════════════
      # Swap reduced from 24 GB to 8 GB. The swapfile consumes real
      # disk, and 24 GB left too little room for the toolchain.
      # ════════════════════════════════════════════════════════════
      - name: Set up swap (8 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Show repo layout and environment
        run: |
          echo "==> Kernel version:"
          make kernelversion 2>/dev/null || head -5 Makefile
          echo ""
          echo "==> .kernel_build_mode marker:"
          cat .kernel_build_mode 2>/dev/null || echo "(not found)"
          echo ""
          echo "==> scripts/build/ contents:"
          ls -la scripts/build/ 2>/dev/null || echo "(scripts/build not found)"
          echo ""
          echo "==> CPU / memory:"
          nproc
          free -h
          echo ""
          echo "==> Disk before build:"
          df -h /

      - name: Build kernel (${{ inputs.mode }})
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          set -o pipefail
          chmod +x scripts/build/*.sh

          # Only export JOBS if the user supplied a value, otherwise
          # let the build script default to nproc.
          if [ -n "${JOBS}" ]; then
            echo "==> Using JOBS=${JOBS}"
            export JOBS
          else
            unset JOBS
            echo "==> Using default JOBS (nproc = $(nproc))"
          fi

          ./scripts/build/build.sh "${{ inputs.mode }}"

      - name: Disk usage after build
        if: always()
        run: |
          echo "==> Disk after build:"
          df -h /
          echo ""
          echo "==> Largest directories in workspace:"
          du -h --max-depth=2 . 2>/dev/null | sort -hr | head -20 || true

      - name: List build output
        if: always()
        run: |
          echo "==> Searching for build artifacts..."
          if [ -d out/ ]; then
            find out/ -maxdepth 4 -type f \
              \( -name "*.zip" -o -name "Image" -o -name "Image.gz" \) \
              2>/dev/null || echo "(no matching artifacts)"
          else
            echo "(out/ directory does not exist)"
          fi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yucca-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            out/${{ inputs.mode }}/**/*.zip
            out/${{ inputs.mode }}/**/Image
            out/${{ inputs.mode }}/**/Image.gz
          compression-level: 9
          if-no-files-found: warn
